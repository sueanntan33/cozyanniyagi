  if(inp){inp.style.textDecoration=now?"line-through":"none";inp.style.color=now?"var(--ink-light)":"var(--ink)";}
}

function renderWeeklyPlan(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.weekly_plan;
  const days=getWeekPlanDays(weekPlanOffset);
  const sun=days[0], sat=days[6];
  const fmt=d=>new Date(d.date+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric"});
  const rangeLabel=`${fmt(sun)} – ${fmt(sat)}, ${new Date(sat.date+"T12:00:00").getFullYear()}`;
  const wkKey=sun.date;
  const wpIntention=ld("wp_int_"+wkKey);
  const wpFocus    =ld("wp_focus_"+wkKey);
  const eventsAll  =calEvents();

  // Journal day card colours — match the existing weekly planner palette
  const DAY_COLS=["#D0A0A8","#7088C8","#88A0C8","#90A8B8","#98B0A8","#A0A898","#C898A8"];
  // AM/PM/EVE colours from journal palette
  const AM_COL ="#C8A848"; // gold
  const PM_COL ="#94C8A8"; // mint
  const EVE_COL="#B4A8D8"; // lavender

  const AM_SLOTS =[{h:8,l:"8am"},{h:9,l:"9am"},{h:10,l:"10am"},{h:11,l:"11am"},{h:12,l:"12pm"}];
  const PM_SLOTS =[{h:13,l:"1pm"},{h:14,l:"2pm"},{h:15,l:"3pm"},{h:16,l:"4pm"},{h:17,l:"5pm"},{h:18,l:"6pm"}];
  const EVE_SLOTS=[{h:19,l:"7pm"},{h:20,l:"8pm"},{h:21,l:"9pm"},{h:22,l:"10pm"},{h:23,l:"11pm"},{h:0,l:"12am"}];

  function slotRow(date,s,borderCol){
    const tb=getTBWeek(date);
    const val=(tb[String(s.h)]||"").replace(/</g,"&lt;");
    return`<div style="display:flex;align-items:center;min-height:28px;border-bottom:1px solid #F5EEF0;">
      <div style="width:40px;flex-shrink:0;text-align:right;padding-right:6px;font-size:10px;font-weight:700;color:var(--ink-light);">${s.l}</div>
      <div style="width:2.5px;min-height:28px;background:${borderCol};flex-shrink:0;opacity:.7;border-radius:2px;"></div>
      <input value="${val}" placeholder="..." style="flex:1;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:11px;font-weight:600;color:var(--ink);outline:none;padding:0 8px;height:28px;caret-color:var(--rose-dark);" onchange="saveTBWeek('${date}',${s.h},this.value)"/>
    </div>`;
  }

  function dayCard(day,di){
    const col=DAY_COLS[di];
    const dayEvs=eventsAll.filter(e=>e.date===day.date);
    const focus=ld("wpp_focus_"+day.date);
    const win  =ld("wpp_win_"+day.date);
    const tasks=[1,2,3,4].map(n=>({n,txt:ld("wpp_t"+n+"_"+day.date),done:ld("wpp_td"+n+"_"+day.date)==="1"}));

    return`<div style="background:white;border:${day.isToday?`2px solid ${col}`:"1.5px solid #EEE0EC"};border-radius:18px;overflow:hidden;box-shadow:${day.isToday?`0 4px 18px ${col}44`:"0 2px 10px rgba(180,120,160,.07)"};">

      <!-- Day header - coloured top strip -->
      <div style="background:${col};padding:10px 13px 9px;">
        <div style="font-size:9px;font-weight:900;letter-spacing:.18em;color:rgba(255,255,255,.8);margin-bottom:1px;">${day.dayName}</div>
        <div style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:white;line-height:1;">${day.dayNum}<span style="font-size:11px;font-weight:700;margin-left:4px;opacity:.75;">${day.monthShort}</span></div>
        ${day.isToday?`<div style="font-size:9px;font-weight:800;color:rgba(255,255,255,.7);margin-top:2px;">🌸 Today</div>`:""}
      </div>

      <!-- Events (if any) -->
      ${dayEvs.length?`<div style="padding:5px 10px 4px;background:#FFF8FA;border-bottom:1px solid #F5EEF0;">
        ${dayEvs.slice(0,3).map(e=>`<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;">
          <div style="width:5px;height:5px;border-radius:50%;background:${e.color||"#E8A0A8"};flex-shrink:0;"></div>
          <span style="font-size:10px;font-weight:700;color:var(--ink-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.title}${e.time?" · "+e.time:""}</span>
        </div>`).join("")}
      </div>`:""}

      <!-- Focus -->
      <div style="padding:9px 13px 8px;border-bottom:1px solid #F5EEF0;background:var(--cream);">
        <div style="font-size:8px;font-weight:900;letter-spacing:.16em;color:var(--gold);display:flex;align-items:center;gap:4px;margin-bottom:5px;">⭐ FOCUS</div>
        <input value="${focus.replace(/"/g,"&quot;")}" placeholder="Main task..." style="width:100%;border:none;border-bottom:1.5px solid var(--rose);background:transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);outline:none;padding:2px 0 3px;caret-color:var(--rose-dark);" onchange="sv('wpp_focus_${day.date}',this.value)"/>
      </div>

      <!-- Tasks -->
      <div style="padding:8px 13px 6px;border-bottom:1px solid #F5EEF0;">
        <div style="font-size:8px;font-weight:900;letter-spacing:.16em;color:var(--ink-light);margin-bottom:6px;">TASKS</div>
        ${tasks.map(t=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;border-bottom:1px solid #F5EEF0;padding-bottom:5px;">
          <div onclick="toggleWPTask('${day.date}',${t.n},this)" style="width:17px;height:17px;border-radius:50%;border:1.5px solid ${t.done?"#88C8A8":"#D8C0C8"};background:${t.done?"linear-gradient(135deg,#C8EED8,#A8DCC0)":"white"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:white;transition:all .15s;">${t.done?"✓":""}</div>
          <input id="wpp_t${t.n}_${day.date}" value="${t.txt.replace(/"/g,"&quot;")}" placeholder="Task ${t.n}…" style="flex:1;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:${t.done?"var(--ink-light)":"var(--ink)"};${t.done?"text-decoration:line-through;":""}outline:none;caret-color:var(--rose-dark);" onchange="sv('wpp_t${t.n}_${day.date}',this.value)"/>
        </div>`).join("")}
      </div>

      <!-- AM -->
      <div>
        <div style="padding:6px 13px 4px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #F5EEF0;">
          <span style="font-size:12px;">☀️</span><span style="font-size:8px;font-weight:900;letter-spacing:.16em;color:${AM_COL};">AM</span>
        </div>
        ${AM_SLOTS.map(s=>slotRow(day.date,s,AM_COL)).join("")}
      </div>

      <!-- PM -->
      <div>
        <div style="padding:6px 13px 4px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #F5EEF0;">
          <span style="font-size:12px;">🌤️</span><span style="font-size:8px;font-weight:900;letter-spacing:.16em;color:${PM_COL};">PM</span>
        </div>
        ${PM_SLOTS.map(s=>slotRow(day.date,s,PM_COL)).join("")}
      </div>

      <!-- EVE -->
      <div>
        <div style="padding:6px 13px 4px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #F5EEF0;">
          <span style="font-size:12px;">🌙</span><span style="font-size:8px;font-weight:900;letter-spacing:.16em;color:${EVE_COL};">EVE</span>
        </div>
        ${EVE_SLOTS.map(s=>slotRow(day.date,s,EVE_COL)).join("")}
      </div>

      <!-- Win -->
      <div style="margin:9px 10px 10px;background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:10px;padding:8px 11px;">
        <div style="font-size:8px;font-weight:900;letter-spacing:.14em;color:var(--gold);display:flex;align-items:center;gap:4px;margin-bottom:4px;">🏆 WIN</div>
        <textarea placeholder="Today's win…" style="width:100%;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:11px;font-style:italic;color:var(--ink-mid);outline:none;resize:none;min-height:42px;line-height:1.6;" onchange="sv('wpp_win_${day.date}',this.value)">${win}</textarea>
      </div>
    </div>`;
  }

  document.getElementById("pageInner").innerHTML=`
    <!-- Page heading — journal style -->
    <div class="section-heading">📋 Weekly Pre-Planning</div>
    <div class="section-sub">plan with intention · live with purpose</div>
    <div class="divider"></div>

    <!-- Nav row — journal nav-btn style -->
    <div class="nav-row" style="margin-bottom:12px;">
      <button class="nav-btn" onclick="weekPlanOffset--;renderWeeklyPlan()">◀ Prev Week</button>
      <button class="nav-btn" onclick="weekPlanOffset=0;renderWeeklyPlan()" style="background:var(--blush);color:var(--rose-deep);border-color:var(--rose);font-weight:900;">This Week</button>
      <button class="nav-btn" onclick="weekPlanOffset++;renderWeeklyPlan()">Next Week ▶</button>
    </div>
    <div style="text-align:center;font-family:'Dancing Script',cursive;font-size:17px;font-weight:700;color:var(--rose-deep);margin-bottom:14px;">${rangeLabel}</div>

    <!-- Week intention row -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <div class="sec-label" style="margin-bottom:5px;">🌿 Week Intention</div>
          <textarea class="box-textarea" style="min-height:46px;" placeholder="My focus this week…" onchange="sv('wp_int_${wkKey}',this.value)">${wpIntention}</textarea>
        </div>
        <div>
          <div class="sec-label" style="margin-bottom:5px;">✦ One Big Goal</div>
          <textarea class="box-textarea" style="min-height:46px;" placeholder="Most important this week…" onchange="sv('wp_focus_${wkKey}',this.value)">${wpFocus}</textarea>
        </div>
      </div>
    </div>

    <!-- 2-column day cards -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${days.map((d,i)=>dayCard(d,i)).join("")}
    </div>
  `;
}

// ── SHOPPING LIST ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const SL_CATS=[
  {name:"🥦 Produce",    key:"produce",   col:"#94C8A8", bg:"rgba(148,200,168,.12)"},
  {name:"🥛 Dairy",      key:"dairy",     col:"#90B8D8", bg:"rgba(144,184,216,.12)"},
  {name:"🥩 Meat",       key:"meat",      col:"#E8A0A8", bg:"rgba(232,160,168,.12)"},
  {name:"🍞 Bakery",     key:"bakery",    col:"#F0C090", bg:"rgba(240,192,144,.12)"},
  {name:"🧊 Frozen",     key:"frozen",    col:"#B4A8D8", bg:"rgba(180,168,216,.12)"},
  {name:"🥫 Pantry",     key:"pantry",    col:"#C8A848", bg:"rgba(200,168,72,.12)"},
  {name:"🧃 Beverages",  key:"beverages", col:"#8CB8D8", bg:"rgba(140,184,216,.12)"},
  {name:"🧹 Household",  key:"household", col:"#A0B898", bg:"rgba(160,184,152,.12)"},
  {name:"💄 Beauty",     key:"beauty",    col:"#D8A0C8", bg:"rgba(216,160,200,.12)"},
  {name:"✦ Other",       key:"other",     col:"#C8B4A8", bg:"rgba(200,180,168,.12)"},
];
const SL_CAT_KEYS=SL_CATS.map(c=>c.key);
const SL_CAT_BY_KEY=Object.fromEntries(SL_CATS.map(c=>[c.key,c]));

// Multiple named lists
function slLists(){try{return JSON.parse(ld("sl_lists",'[{"id":"main","name":"Groceries"},{"id":"workbag","name":"Work Bag 💼"}]'));}catch(e){return[{id:"main",name:"Groceries"},{id:"workbag",name:"Work Bag 💼"}];}}
function saveSLLists(a){sv("sl_lists",JSON.stringify(a));}
function slItems(listId){try{return JSON.parse(ld("sl_items_"+listId,"[]"));}catch(e){return[];}}
function saveSLItems(listId,a){sv("sl_items_"+listId,JSON.stringify(a));}

// Seed work bag defaults on first run
(function seedWorkBag(){
  if(ld("workbag_seeded"))return;
  const mk=()=>"wb"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const items=[
    "Laptop","Laptop charger","Phone charger","Power bank",
    "Notebook & pen","Work ID / badge","Wallet & cards","Keys",
    "Earphones / AirPods","Water bottle","Snack","Hand sanitiser",
    "Painkillers","Lip balm","Umbrella","Glasses / sunglasses",
    "USB drive","Tissues","Face mask","Daily planner",
  ].map(text=>({id:mk(),text,cat:text.includes("sanitiser")||text.includes("Painkiller")||text.includes("mask")?"health":"other",done:false,qty:"",note:""}));
  saveSLItems("workbag",items);
  sv("workbag_seeded","1");
})();
function slUID(){return "sl"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

let curSlList="main", slCatFilter="all";

function renderShopping(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.shopping;
  const lists=slLists();
  const curListObj=lists.find(l=>l.id===curSlList)||lists[0];
  if(!curListObj){curSlList="main";return renderShopping();}
  const items=slItems(curSlList);
  const total=items.length;
  const done=items.filter(i=>i.done).length;
  const pending=total-done;
  const pct=total?Math.round(done/total*100):0;

  // Group by category — only non-done items (or all if showing all)
  const pendingItems=items.filter(i=>!i.done);
  const doneItems=items.filter(i=>i.done);

  // Category filter
  const filtered=slCatFilter==="all"?pendingItems:pendingItems.filter(i=>i.cat===slCatFilter);

  // Group pending by category
  const grouped={};
  filtered.forEach(item=>{(grouped[item.cat]=grouped[item.cat]||[]).push(item);});

  function itemRow(item){
    const cat=SL_CAT_BY_KEY[item.cat]||SL_CAT_BY_KEY.other;
    return`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(220,200,220,.12);transition:background .15s;" ${item.done?`style="opacity:.5;"`:""}  >
      <div onclick="toggleSlItem('${item.id}')" style="width:24px;height:24px;border-radius:50%;border:2px solid ${item.done?"transparent":"#D8C0C8"};background:${item.done?"linear-gradient(135deg,#C8EED8,#A8DCC0)":"white"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:white;transition:all .18s;">${item.done?"✓":""}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:${item.done?600:800};color:${item.done?"var(--ink-light)":"var(--ink)"};${item.done?"text-decoration:line-through;":""}line-height:1.3;">${item.text}</div>
        <div style="display:flex;gap:5px;align-items:center;margin-top:3px;">
          <span style="font-size:10px;font-weight:800;background:${cat.bg};color:${cat.col};border-radius:20px;padding:1px 8px;">${cat.name}</span>
          ${item.qty?`<span style="font-size:10px;font-weight:700;color:var(--ink-light);">× ${item.qty}</span>`:""}
          ${item.note?`<span style="font-size:10px;font-weight:600;color:var(--ink-light);">· ${item.note}</span>`:""}
        </div>
      </div>
      <button onclick="deleteSlItem('${item.id}')" style="background:none;border:none;color:#D8C0C8;cursor:pointer;font-size:14px;padding:0;flex-shrink:0;line-height:1;" onmouseover="this.style.color='var(--rose-dark)'" onmouseout="this.style.color='#D8C0C8'">✕</button>
    </div>`;
  }

  // Build category groups html
  let groupsHtml="";
  if(filtered.length===0&&slCatFilter==="all"&&pendingItems.length===0){
    groupsHtml=`<div style="text-align:center;padding:28px 16px;"><span style="font-size:40px;display:block;margin-bottom:10px;">🛒</span><div style="font-family:'Dancing Script',cursive;font-size:18px;color:var(--ink-light);">${total>0?"All done! 🎉":"Your list is empty"}</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:5px;">${total>0?"Tap ✓ Clear Done to reset":"Add your first item above 🌸"}</div></div>`;
  } else if(filtered.length===0){
    groupsHtml=`<div style="text-align:center;padding:24px;color:var(--ink-light);font-size:13px;font-weight:700;">No items in this category</div>`;
  } else {
    // Show items grouped by category
    const catsPresent=SL_CATS.filter(c=>grouped[c.key]?.length);
    groupsHtml=catsPresent.map(cat=>`
      <div style="margin-bottom:4px;">
        <div style="padding:7px 14px 4px;background:${cat.bg};border-bottom:1px solid rgba(220,200,220,.15);">
          <span style="font-size:10px;font-weight:900;letter-spacing:.12em;color:${cat.col};">${cat.name}</span>
          <span style="font-size:10px;font-weight:700;color:${cat.col};margin-left:6px;opacity:.7;">(${grouped[cat.key].length})</span>
        </div>
        ${grouped[cat.key].map(item=>itemRow(item)).join("")}
      </div>`).join("");
  }

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">🛒 Shopping List</div>
    <div class="section-sub">never forget a thing 🌸</div>
    <div class="divider"></div>

    <!-- List tabs -->
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
      ${lists.map(l=>`<button onclick="curSlList='${l.id}';slCatFilter='all';renderShopping()" style="border-radius:20px;padding:5px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid;transition:all .15s;${curSlList===l.id?"background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border-color:transparent;box-shadow:0 2px 8px rgba(220,130,160,.3);":"background:white;color:var(--ink-light);border-color:#EEE0EC;"}">${l.name}</button>`).join("")}
      <button onclick="addSlList()" style="border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px dashed rgba(220,160,180,.5);background:var(--rose-s,#FFF5F8);color:var(--rose-dark);transition:all .15s;">+ New List</button>
      ${lists.length>1?`<button onclick="deleteSlList('${curSlList}')" style="border-radius:20px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid #EEE0EC;background:white;color:var(--ink-light);margin-left:auto;">🗑️</button>`:""}
    </div>

    <!-- Progress bar -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="font-size:13px;font-weight:900;color:var(--rose-dark);">${pending} left</span>
          <span style="font-size:11px;font-weight:700;color:var(--ink-light);">·  ${done} done</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span style="font-size:11px;font-weight:900;color:var(--mint);">${pct}%</span>
          ${done>0?`<button onclick="clearDoneSlItems()" style="border:1.5px solid #EEE0EC;border-radius:20px;padding:3px 10px;background:white;font-size:10px;font-weight:800;color:var(--ink-light);cursor:pointer;font-family:'Nunito',sans-serif;">✓ Clear done</button>`:""}
          <button onclick="resetAllSlItems('${curSlList}')" style="border:1.5px solid #F0C8D0;border-radius:20px;padding:3px 10px;background:var(--blush);font-size:10px;font-weight:800;color:var(--rose-dark);cursor:pointer;font-family:'Nunito',sans-serif;">↺ Reset all</button>
        </div>
      </div>
      <div style="height:7px;background:#F0E8EC;border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--rose),var(--mint));border-radius:4px;transition:width .4s;"></div>
      </div>
    </div>

    <!-- Add item form -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">✦ Add Item</div>
      <!-- Main input -->
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:8px;">
        <input id="sl-text" style="flex:1;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;transition:border-color .2s;" placeholder="Add an item..." onfocus="this.style.borderColor='var(--rose)'" onblur="this.style.borderColor='#EEE0EC'" onkeydown="if(event.key==='Enter')addSlItem()"/>
        <button onclick="addSlItem()" style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-dark));border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(220,130,160,.4);">+</button>
      </div>
      <!-- Category + qty + note row -->
      <div style="display:grid;grid-template-columns:1fr auto auto;gap:7px;">
        <select id="sl-cat" style="border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;cursor:pointer;">
          ${SL_CATS.map(c=>`<option value="${c.key}">${c.name}</option>`).join("")}
        </select>
        <input id="sl-qty" type="text" placeholder="Qty" style="width:60px;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 9px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;text-align:center;"/>
        <input id="sl-note" placeholder="Note" style="width:80px;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 9px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);background:#FAFAFA;outline:none;" onkeydown="if(event.key==='Enter')addSlItem()"/>
      </div>
    </div>

    <!-- Category filter pills -->
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">
      <button onclick="slCatFilter='all';renderShopping()" style="border-radius:20px;padding:4px 12px;font-size:10px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid;transition:all .15s;${slCatFilter==="all"?"background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border-color:transparent;":"background:white;color:var(--ink-light);border-color:#EEE0EC;}"}">🛒 All (${pendingItems.length})</button>

          <span>✓ Done (${doneItems.length})</span>

        </summary>
        <div style="border-top:1px solid #F0E8EC;opacity:.6;">
          ${doneItems.map(item=>itemRow(item)).join("")}

}

function addSlItem(){
  const text=document.getElementById("sl-text")?.value?.trim();
  if(!text)return;
  const cat=document.getElementById("sl-cat")?.value||"other";
  const qty=document.getElementById("sl-qty")?.value?.trim()||"";
  const note=document.getElementById("sl-note")?.value?.trim()||"";
  const items=slItems(curSlList);
  items.unshift({id:slUID(),text,cat,qty,note,done:false,added:Date.now()});
  saveSLItems(curSlList,items);
  renderShopping();
  // Keep focus on input for rapid adding
  setTimeout(()=>{
    const el=document.getElementById("sl-text");
    if(el){el.value="";el.focus();}
    const qel=document.getElementById("sl-qty");if(qel)qel.value="";
    const nel=document.getElementById("sl-note");if(nel)nel.value="";
  },30);
}
function toggleSlItem(id){
  const items=slItems(curSlList);
  const item=items.find(i=>i.id===id);
  if(item)item.done=!item.done;
  saveSLItems(curSlList,items);renderShopping();
}
function deleteSlItem(id){
  saveSLItems(curSlList,slItems(curSlList).filter(i=>i.id!==id));renderShopping();
}
function clearDoneSlItems(){
  saveSLItems(curSlList,slItems(curSlList).filter(i=>!i.done));renderShopping();
}
function resetAllSlItems(listId){
  const items=slItems(listId);
  if(!items.length)return;
  items.forEach(i=>i.done=false);
  saveSLItems(listId,items);
  renderShopping();
  showToast("All items reset ↺");
}
function addSlList(){
  const name=prompt("List name (e.g. Costco, Pharmacy):");
  if(!name?.trim())return;
  const lists=slLists();
  const newId="sl"+Date.now().toString(36);
  lists.push({id:newId,name:name.trim()});
  saveSLLists(lists);curSlList=newId;renderShopping();
}
function deleteSlList(id){
  if(id==="main"){alert("Can't delete the main list.");return;}
  if(!confirm("Delete this list and all its items?"))return;
  const lists=slLists().filter(l=>l.id!==id);
  saveSLLists(lists);sv("sl_items_"+id,"[]");
  curSlList=lists[0]?.id||"main";renderShopping();
}

function linksList(){return lda("links_v1");}
function saveLinks(a){sva("links_v1",a);}
function linkUID(){return "lk"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

let linkCatFilter="all", linkSearch="", linkSortPinned=true;

function cleanURL(u){
  if(!u)return"";
  u=u.trim();
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  return u;
}
function displayURL(u){
  try{const p=new URL(u);return p.hostname.replace(/^www\./,"");}catch(e){return u.replace(/^https?:\/\//,"").split("/")[0];}
}
function faviconURL(u){
  try{const p=new URL(u);return`https://www.google.com/s2/favicons?domain=${p.hostname}&sz=32`;}catch(e){return"";}
}

      listHtml+=`<div style="padding:7px 14px 4px;background:rgba(240,220,200,.15);border-bottom:1px solid rgba(220,200,220,.15);"><span style="font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);">📌 Pinned</span></div>`;
      listHtml+=pinned.map(l=>linkCard(l)).join("");
      const unpinnedCats=LINK_CATS.filter(c=>c.key!=="all"&&(grouped[c.key]||[]).some(l=>!l.pinned));
      unpinnedCats.forEach(cat=>{
        const items=(grouped[cat.key]||[]).filter(l=>!l.pinned);

  document.getElementById("pageInner").innerHTML=`

function addLink(){
  const title=document.getElementById("lk-title")?.value?.trim();
  const url  =document.getElementById("lk-url")?.value?.trim();
  if(!title||!url){
    if(!title)document.getElementById("lk-title")?.focus();
    else document.getElementById("lk-url")?.focus();
    return;
  }
  const cat =document.getElementById("lk-cat")?.value||"other";
  const note=document.getElementById("lk-note")?.value?.trim()||"";
  const all =linksList();
  all.unshift({id:linkUID(),title,url:cleanURL(url),cat,note,pinned:false,added:Date.now()});
  saveLinks(all);renderLinks();
}
function deleteLink(id){
  if(!confirm("Remove this link?"))return;
  saveLinks(linksList().filter(l=>l.id!==id));renderLinks();
}
function togglePinLink(id){
  const all=linksList();const l=all.find(l=>l.id===id);
  if(l)l.pinned=!l.pinned;saveLinks(all);renderLinks();
}
function copyLink(url){
  navigator.clipboard?.writeText(url).then(()=>{
    const t=document.createElement("div");
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:800;box-shadow:0 4px 14px rgba(200,120,150,.4);z-index:9999;font-family:'Nunito',sans-serif;white-space:nowrap;";
    t.textContent="Copied! 📋";document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
  });
}

// ── READING TRACKER ───────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const READ_STATUSES=["Reading","Want to Read","Completed","On Hold","Abandoned"];
const RS_COL={"Reading":"#E8A0A8","Want to Read":"#B4A8D8","Completed":"#94C8A8","On Hold":"#F0C090","Abandoned":"#C8B8A8"};
const RS_BG={"Reading":"rgba(232,160,168,.12)","Want to Read":"rgba(180,168,216,.12)","Completed":"rgba(148,200,168,.15)","On Hold":"rgba(240,192,144,.12)","Abandoned":"rgba(200,184,168,.1)"};
const READ_GENRES=["Fiction","Non-Fiction","Self-Help","Christian","Biography","History","Science","Fantasy","Romance","Poetry","Other"];

function readBooks(){return lda("read_books_v1");}
function saveBooks(a){sva("read_books_v1",a);}
function buid(){return "bk"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

let readFilter="All", readSearch="";

function renderReading(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.reading;
  const all=readBooks();
  const reading=all.filter(b=>b.status==="Reading").length;
  const done=all.filter(b=>b.status==="Completed").length;
  const want=all.filter(b=>b.status==="Want to Read").length;
  const totalPages=all.filter(b=>b.status==="Completed").reduce((s,b)=>s+(parseInt(b.pages)||0),0);
  const goal=parseInt(ld("read_goal","12"))||12;
  const goalPct=Math.min(100,Math.round(done/goal*100));

  let filtered=[...all];
  if(readFilter!=="All")filtered=filtered.filter(b=>b.status===readFilter);
  if(readSearch.trim())filtered=filtered.filter(b=>(b.title+b.author+b.genre).toLowerCase().includes(readSearch.toLowerCase()));
  filtered.sort((a,b)=>{
    const order=["Reading","Want to Read","Completed","On Hold","Abandoned"];
    return order.indexOf(a.status)-order.indexOf(b.status);
  });

  function starRating(rating,bid){
    return Array.from({length:5},(_,i)=>`<span onclick="setRating('${bid}',${i+1})" style="font-size:16px;cursor:pointer;color:${(rating||0)>i?"#C8A848":"#EDE0D8"};transition:color .15s;">★</span>`).join("");
  }

  function bookCard(b){
    const sc=RS_COL[b.status]||"#9C8C84";
    const sbg=RS_BG[b.status]||"rgba(156,140,132,.1)";
    const pct=b.pages&&b.pagesRead?Math.min(100,Math.round(b.pagesRead/b.pages*100)):0;
    return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(180,120,160,.07);">
      <div style="display:flex;gap:12px;padding:13px 14px 11px;">
        <!-- Spine colour bar -->
        <div style="width:5px;border-radius:3px;background:${sc};flex-shrink:0;align-self:stretch;min-height:40px;"></div>

function addBook(){
  const title=document.getElementById("bk-title")?.value?.trim();
  if(!title){document.getElementById("bk-title")?.focus();return;}
  const all=readBooks();
  all.unshift({id:buid(),title,author:document.getElementById("bk-author")?.value?.trim()||"",pages:document.getElementById("bk-pages")?.value||"",status:document.getElementById("bk-status")?.value||"Want to Read",genre:document.getElementById("bk-genre")?.value||"Other",rating:0,pagesRead:0,notes:"",added:Date.now()});
  saveBooks(all);renderReading();
}
function deleteBook(id){if(!confirm("Remove this book?"))return;saveBooks(readBooks().filter(b=>b.id!==id));renderReading();}
function cycleBookStatus(id){
  const all=readBooks();const b=all.find(b=>b.id===id);if(!b)return;
  const idx=READ_STATUSES.indexOf(b.status);b.status=READ_STATUSES[(idx+1)%READ_STATUSES.length];
  saveBooks(all);renderReading();
}
function setRating(id,r){const all=readBooks();const b=all.find(b=>b.id===id);if(!b)return;b.rating=r;saveBooks(all);renderReading();}
function updatePagesRead(id,v){const all=readBooks();const b=all.find(b=>b.id===id);if(!b)return;b.pagesRead=parseInt(v)||0;if(b.pages&&b.pagesRead>=parseInt(b.pages))b.status="Completed";saveBooks(all);renderReading();}
function updateBookNote(id,v){const all=readBooks();const b=all.find(b=>b.id===id);if(!b)return;b.notes=v;saveBooks(all);}

function deobfuscate(str){if(!str)return"";try{const k="j26pw";return atob(str).split("").map((c,i)=>String.fromCharCode(c.charCodeAt(0)^k.charCodeAt(i%k.length))).join("");}catch(e){return str;}}

function addPWEntry(){
  const site=document.getElementById("pw-site")?.value?.trim();
  if(!site){document.getElementById("pw-site")?.focus();return;}
  const pw=document.getElementById("pw-pw")?.value||"";
  const all=pwEntries();
  all.unshift({id:pwUID(),site,username:document.getElementById("pw-user")?.value?.trim()||"",email:document.getElementById("pw-email")?.value?.trim()||"",pw:obfuscate(pw),cat:document.getElementById("pw-cat")?.value||"Other",url:document.getElementById("pw-url")?.value?.trim()||"",notes:document.getElementById("pw-notes")?.value?.trim()||"",added:Date.now()});
  savePW(all);pwShowId=null;renderPasswords();
}
function deletePWEntry(id){if(!confirm("Delete this entry?"))return;savePW(pwEntries().filter(p=>p.id!==id));if(pwShowId===id)pwShowId=null;renderPasswords();}
function editPWEntry(id){
  const all=pwEntries();const p=all.find(p=>p.id===id);if(!p)return;
  const newSite=prompt("Site name:",p.site);if(newSite===null)return;
  const newUser=prompt("Username:",p.username)||"";
  const newEmail=prompt("Email:",p.email)||"";
  const newPW=prompt("Password (leave blank to keep current):");
  const newNotes=prompt("Notes:",p.notes)||"";
  p.site=newSite.trim()||p.site;p.username=newUser;p.email=newEmail;
  if(newPW!==null&&newPW!=="")p.pw=obfuscate(newPW);
  p.notes=newNotes;
  savePW(all);renderPasswords();
}
function copyPW(id){
  const p=pwEntries().find(p=>p.id===id);if(!p)return;
  const pw=deobfuscate(p.pw);
  navigator.clipboard?.writeText(pw).then(()=>{
    const t=document.createElement("div");
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--lavender),var(--rose-dark));color:white;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:800;box-shadow:0 4px 14px rgba(180,140,200,.4);z-index:9999;font-family:'Nunito',sans-serif;white-space:nowrap;";
    t.textContent="Password copied! 🔑";document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
  });
}
function togglePWVis(id){const el=document.getElementById(id);if(el)el.type=el.type==="password"?"text":"password";}
function generatePW(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&";
  const pw=Array.from({length:16},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
  const el=document.getElementById("pw-pw");if(el){el.value=pw;el.type="text";}
}

function addOneMtg(){
  const person=document.getElementById("om-person")?.value?.trim();
  if(!person){document.getElementById("om-person")?.focus();return;}
  const all=oneMtgs();
  const id=oneMUID();
  all.unshift({id,person,role:document.getElementById("om-role")?.value?.trim()||"",date:document.getElementById("om-date")?.value||tds(),wins:"",challenges:"",notes:"",feedback:"",actions:[],nextDate:"",nextTopic:"",rating:0,created:Date.now()});
  saveOneMtgs(all);curOneMtg=id;renderOneOnOne();
}
function deleteOneMtg(id){if(!confirm("Delete this 1:1?"))return;saveOneMtgs(oneMtgs().filter(m=>m.id!==id));}
function updateOneMtgField(id,field,val){const all=oneMtgs();const m=all.find(m=>m.id===id);if(m)m[field]=val;saveOneMtgs(all);}
function addOneMtgAction(id){
  const text=document.getElementById("om-act-text")?.value?.trim();if(!text)return;
  const owner=document.getElementById("om-act-own")?.value?.trim()||"";
  const all=oneMtgs();const m=all.find(m=>m.id===id);if(!m)return;
  if(!m.actions)m.actions=[];m.actions.push({id:oneAID(),text,owner,done:false});
  saveOneMtgs(all);renderOneMtgDetail(id);setTimeout(()=>document.getElementById("om-act-text")?.focus(),60);
}
function toggleOneMtgAction(id,idx){const all=oneMtgs();const m=all.find(m=>m.id===id);if(!m||!m.actions)return;m.actions[idx].done=!m.actions[idx].done;saveOneMtgs(all);renderOneMtgDetail(id);}
function deleteOneMtgAction(id,idx){const all=oneMtgs();const m=all.find(m=>m.id===id);if(!m||!m.actions)return;m.actions.splice(idx,1);saveOneMtgs(all);renderOneMtgDetail(id);}

function addSAMtg(){
  const title=document.getElementById("sa-title")?.value?.trim();
  if(!title){document.getElementById("sa-title")?.focus();return;}
  const all=saMtgs(); const id=saUID();
  all.unshift({id,title,type:document.getElementById("sa-type")?.value||"Other",date:document.getElementById("sa-date")?.value||tds(),time:document.getElementById("sa-time")?.value||"",attendees:"",agenda:"",notes:"",decisions:"",followups:"",actions:[],created:Date.now()});
  saveSAMtgs(all);curSAMtg=id;renderStandaloneMtg();
}
function deleteSAMtg(id){if(!confirm("Delete this meeting?"))return;saveSAMtgs(saMtgs().filter(m=>m.id!==id));}
function updateSAField(id,field,val){const all=saMtgs();const m=all.find(m=>m.id===id);if(m)m[field]=val;saveSAMtgs(all);}
function addSAAction(id){
  const text=document.getElementById("sa-act-text")?.value?.trim();if(!text)return;
  const owner=document.getElementById("sa-act-own")?.value?.trim()||"";
  const due=document.getElementById("sa-act-due")?.value||"";
  const all=saMtgs();const m=all.find(m=>m.id===id);if(!m)return;
  if(!m.actions)m.actions=[];m.actions.push({id:saAID(),text,owner,due,done:false});
  saveSAMtgs(all);renderSAMtgDetail(id);setTimeout(()=>document.getElementById("sa-act-text")?.focus(),60);
}
function toggleSAAction(id,idx){const all=saMtgs();const m=all.find(m=>m.id===id);if(!m||!m.actions)return;m.actions[idx].done=!m.actions[idx].done;saveSAMtgs(all);renderSAMtgDetail(id);}
function deleteSAAction(id,idx){const all=saMtgs();const m=all.find(m=>m.id===id);if(!m||!m.actions)return;m.actions.splice(idx,1);saveSAMtgs(all);renderSAMtgDetail(id);}

const RECUR_FREQS=["Daily","Weekdays","Weekly","Bi-weekly","Monthly"];
const RECUR_FREQ_EMOJI={Daily:"📅",Weekdays:"💼",Weekly:"📋",Biweekly:"📆",Monthly:"🗓️"};

function recurringTasks(){return lda("recurring_tasks_v1");}
function saveRecurring(a){sva("recurring_tasks_v1",a);}
function ruid(){return "rt"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// Check if a recurring task should be active today and spawn a todo if not already done today
function syncRecurringTasks(){
  const tasks=recurringTasks();
  const today=tds();
  const todayDate=new Date(today+"T12:00:00");
  const dow=todayDate.getDay(); // 0=Sun,1=Mon...6=Sat
  const dom=todayDate.getDate();
  let todos=lda("todos");
  let changed=false;

  tasks.forEach(rt=>{
    if(!rt.active)return;
    // Check if already spawned today
    const alreadySpawned=todos.some(t=>t.recurId===rt.id&&t.date===today);
    if(alreadySpawned)return;
    // Check frequency
    let shouldSpawn=false;
    if(rt.freq==="Daily")shouldSpawn=true;
    else if(rt.freq==="Weekdays"&&dow>=1&&dow<=5)shouldSpawn=true;
    else if(rt.freq==="Weekly"&&rt.dayOfWeek===dow)shouldSpawn=true;
    else if(rt.freq==="Bi-weekly"){
      // Spawn on the chosen day every 2 weeks from creation
      if(rt.dayOfWeek===dow){
        const created=new Date(rt.created||Date.now());
        const weeksDiff=Math.floor((todayDate-created)/(7*864e5));
        if(weeksDiff%2===0)shouldSpawn=true;
      }
    }
    else if(rt.freq==="Monthly"&&rt.dayOfMonth===dom)shouldSpawn=true;

    if(shouldSpawn){
      todos.unshift({
        id:ruid(),text:rt.text,cat:rt.cat||"Personal",pri:rt.pri||"med",
        done:false,date:today,due:"",note:rt.note||"",
        subtasks:[],kanbanCol:"todo",recurId:rt.id,isRecurring:true
      });
      changed=true;
    }
  });
  if(changed)sva("todos",todos);
}

function deleteRecurring(id){

// Diary helpers
function save_diary(){
  const dateEl=document.getElementById("de-date");
  const notesEl=document.getElementById("de-notes");
  if(!dateEl)return;
  const id=curDiaryEntry==="new"?diaryUID():curDiaryEntry;
  const all=diaryEntries().filter(x=>x.id!==id);
  // Pull current mood/weather from global temp vars
  const existing=diaryEntries().find(x=>x.id===id)||{};
  all.push({id,date:dateEl.value,notes:notesEl?.value||"",mood:existing.mood||"",weather:existing.weather||"",image:existing.image||""});
  saveDiary(all);
}

function selectDiaryMood(mood,id){
  // Update in storage immediately
  const all=diaryEntries();
  const e=all.find(x=>x.id===id);
  if(e)e.mood=mood;
  else all.push({id,date:tds(),mood,weather:"",notes:"",image:""});
  saveDiary(all);
  // Update UI highlight
  document.querySelectorAll("#mood-picker div").forEach(el=>{
    const m=el.getAttribute("data-mood");
    el.style.border=m===mood?"2px solid var(--rose)":"2px solid transparent";
    el.style.background=m===mood?"var(--blush)":"transparent";
  });
}
function selectDiaryWeather(weather,id){
  const all=diaryEntries();
  const e=all.find(x=>x.id===id);
  if(e)e.weather=weather;
  else all.push({id,date:tds(),mood:"",weather,notes:"",image:""});
  saveDiary(all);
  document.querySelectorAll("#weather-picker div").forEach(el=>{
    const w=el.getAttribute("data-weather");
    el.style.border=w===weather?"2px solid var(--rose)":"2px solid transparent";
    el.style.background=w===weather?"var(--blush)":"transparent";
  });
}
function loadDiaryPhoto(event,id){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const all=diaryEntries();
    const entry=all.find(x=>x.id===id);
    if(entry)entry.image=e.target.result;
    else all.push({id,date:tds(),mood:"",weather:"",notes:"",image:e.target.result});
    saveDiary(all);
    curDiaryEntry=id;
    renderDiary();
  };
  reader.readAsDataURL(file);
}
function removeDiaryPhoto(id){
  const all=diaryEntries();
  const e=all.find(x=>x.id===id);
  if(e){e.image="";saveDiary(all);curDiaryEntry=id;renderDiary();}
}
function deleteDiaryEntry(id){
  if(!confirm("Delete this diary entry?"))return;
  saveDiary(diaryEntries().filter(e=>e.id!==id));
  curDiaryEntry=null;renderDiary();
}

function doExport(){
  // Collect all relevant localStorage keys
  const KEYS_TO_BACKUP=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k)KEYS_TO_BACKUP.push(k);
  }
  const data={};
  KEYS_TO_BACKUP.forEach(k=>{
    try{data[k]=localStorage.getItem(k);}catch(e){}
  });
  // Encode as base64 JSON with a version header
  const payload=JSON.stringify({v:"j26a",ts:Date.now(),data});
  const code=btoa(unescape(encodeURIComponent(payload)));
  // Show output
  const out=document.getElementById("export-output");
  const ta=document.getElementById("export-code");
  if(out)out.style.display="block";
  if(ta)ta.value=code;
}

function copyBackupCode(){
  const code=document.getElementById("export-code")?.value;
  if(!code)return;
  navigator.clipboard?.writeText(code).then(()=>{
    const c=document.getElementById("copy-confirm");
    if(c){c.style.display="block";setTimeout(()=>c.style.display="none",2500);}
  }).catch(()=>{
    // Fallback: select text
    document.getElementById("export-code")?.select();
    document.execCommand("copy");
    showToast("Copied! 📋");
  });
}

function shareBackupCode(){
  const code=document.getElementById("export-code")?.value;if(!code)return;
  if(navigator.share){
    navigator.share({title:"My Journal Backup",text:"Bloom Journal 2026 backup code:\n\n"+code}).catch(()=>{});
  } else {
    copyBackupCode();
    showToast("Copied — paste into Notes app 🌸");
  }
}

function doImport(){
  const code=document.getElementById("import-code")?.value?.trim();
  const errEl=document.getElementById("import-error");
  if(!code){if(errEl){errEl.textContent="Please paste a backup code first.";errEl.style.display="block";}return;}
  try{
    const decoded=decodeURIComponent(escape(atob(code)));
    const payload=JSON.parse(decoded);
    if(!payload.v||!payload.v.startsWith("j26")||!payload.data){
      throw new Error("Invalid format");
    }
    if(!confirm(`Restore backup from ${new Date(payload.ts).toLocaleString()}?\n\nThis will replace ALL current data on this device. This cannot be undone.`)){return;}
    // Restore all keys
    Object.entries(payload.data).forEach(([k,v])=>{
      try{localStorage.setItem(k,v);}catch(e){}
    });
    showToast("Restored successfully! 🌸");
    setTimeout(()=>{showSection("directory");},1000);
  } catch(e){
    if(errEl){
      errEl.textContent="Invalid backup code. Please check you copied the full code and try again.";
      errEl.style.display="block";
    }
  }
}

  function tripCard(t){
    const start=t.startDate?new Date(t.startDate+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"}):"";
    const end=t.endDate?new Date(t.endDate+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"}):"";
    const cover=t.coverPhoto||"";
    const daysLeft=t.startDate?Math.ceil((new Date(t.startDate+"T12:00:00")-new Date())/864e5):null;
    return`<div onclick="curTrip='${t.id}';travelTab='overview';renderTravel()"
      style="background:white;border:1.5px solid #EEE0EC;border-radius:20px;overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 12px rgba(140,160,200,.1);transition:all .18s;"
      onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 24px rgba(140,160,200,.18)'"
      onmouseout="this.style.transform='';this.style.boxShadow='0 2px 12px rgba(140,160,200,.1)'">
      ${cover?`<div style="height:140px;overflow:hidden;"><img src="${cover}" style="width:100%;height:100%;object-fit:cover;" alt=""/></div>`
        :`<div style="height:90px;background:linear-gradient(135deg,#A8C8E8,#C8D8E8,#A8D8C8);display:flex;align-items:center;justify-content:center;font-size:48px;">${t.emoji||"✈️"}</div>`}
      <div style="padding:12px 14px 14px;">
        <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px;">${t.name}</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;">
          ${start?`<span style="font-size:11px;font-weight:700;color:var(--ink-light);">📅 ${start}${end?" – "+end:""}</span>`:""}
          ${t.destination?`<span style="font-size:11px;font-weight:700;color:var(--ink-light);">📍 ${t.destination}</span>`:""}
          ${daysLeft!==null&&daysLeft>0?`<span style="background:#E8F4FF;color:#3870A8;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:900;">⏳ ${daysLeft}d away</span>`:""}
          ${daysLeft!==null&&daysLeft<=0&&daysLeft>-180?`<span style="background:#EDFFF8;color:var(--mint-d);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:900;">🌸 Past trip</span>`:""}
        </div>
      </div>
    </div>`;
  }

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">✈️ Travel</div>
    <div class="section-sub">Plan · pack · explore · remember 🌍</div>
    <div class="divider"></div>
    <button onclick="addNewTrip()" style="width:100%;background:linear-gradient(135deg,#A8C8E8,#88B8D8);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:900;color:#1A3858;cursor:pointer;font-family:'Nunito',sans-serif;margin-bottom:18px;box-shadow:0 3px 12px rgba(100,140,200,.25);">✈️ Plan a New Trip</button>
    ${trips.length===0?`<div style="text-align:center;padding:48px 20px;"><div style="font-size:56px;margin-bottom:14px;">✈️</div><div style="font-family:'Dancing Script',cursive;font-size:22px;color:var(--ink-light);">Where to next?</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:6px;">Add your first trip above 🌸</div></div>`:""}
    ${upcoming.length?`<div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#3870A8;margin-bottom:10px;">🗺️ Upcoming (${upcoming.length})</div>${upcoming.map(tripCard).join("")}`:""}
    ${past.length?`<div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin:14px 0 10px;">📸 Past Trips (${past.length})</div>${past.map(tripCard).join("")}`:""}
  `;
}

function addNewTrip(){
  const trips=travelTrips();
  const id=tuid();
  const today=tds();
  trips.unshift({id,name:"New Trip",destination:"",emoji:"✈️",startDate:today,endDate:"",coverPhoto:"",notes:"",packingList:{},itinerary:[],diaryDays:[]});
  saveTrips(trips);
  curTrip=id;travelTab="overview";renderTravel();
}

function renderTripDetail(id){
  const trips=travelTrips();
  const t=trips.find(t=>t.id===id);
  if(!t){curTrip=null;return renderTravel();}

  // Tab nav
  const tabs=[
    {key:"overview",  label:"📋 Overview"},
    {key:"packing",   label:"🧳 Packing"},
    {key:"itinerary", label:"📅 Itinerary"},
    {key:"diary",     label:"📸 Diary"},
  ];
  const tabBar=tabs.map(tab=>`<button onclick="travelTab='${tab.key}';renderTripDetail('${id}')"
    style="flex:1;border:none;border-radius:10px;padding:9px 4px;font-size:11px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;${travelTab===tab.key?"background:linear-gradient(135deg,#A8C8E8,#88B8D8);color:#1A3858;box-shadow:0 2px 8px rgba(100,140,200,.25);":"background:transparent;color:var(--ink-light);"}">${tab.label}</button>`).join("");

  const header=`
    <div class="nav-row">
      <button class="nav-btn" onclick="curTrip=null;renderTravel()">◀ All Trips</button>
      <button class="nav-btn" style="color:#C07070;border-color:#F0C0C0;" onclick="deleteTrip('${id}')">🗑️</button>
    </div>
    <div style="display:flex;gap:9px;background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:8px;margin-bottom:14px;box-shadow:0 2px 8px rgba(140,160,200,.08);">${tabBar}</div>
  `;

  if(travelTab==="overview") renderTripOverview(t,header);
  else if(travelTab==="packing") renderTripPacking(t,header);
  else if(travelTab==="itinerary") renderTripItinerary(t,header);
  else if(travelTab==="diary"){
    if(curDiaryDay)renderTripDiaryDay(t,header);
    else renderTripDiary(t,header);
  }
}

// ── OVERVIEW TAB ─────────────────────────────────────────────────────────────

    <!-- Cover photo -->
    <div style="border-radius:16px;overflow:hidden;margin-bottom:14px;position:relative;height:180px;background:linear-gradient(135deg,#A8C8E8,#C8D8E8,#A8D8C8);display:flex;align-items:center;justify-content:center;">
      ${t.coverPhoto?`<img src="${t.coverPhoto}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" alt=""/>`:`<div style="font-size:64px;">${t.emoji||"✈️"}</div>`}
      <label style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.45);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <span style="font-size:14px;">📷</span><span style="font-size:11px;font-weight:800;color:white;">Cover</span>

    <!-- Trip name & emoji -->

      <div style="display:flex;gap:9px;align-items:center;margin-bottom:10px;">
        <input id="t-emoji" value="${t.emoji||"✈️"}" style="width:48px;font-size:26px;border:1.5px solid #EEE0EC;border-radius:10px;padding:6px;text-align:center;outline:none;background:#FAFAFA;"/>
        <input id="t-name" value="${t.name}" placeholder="Trip name..." style="flex:1;border:1.5px solid #EEE0EC;border-radius:10px;padding:10px 12px;font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--ink);outline:none;background:#FAFAFA;"/>
      </div>
      <input id="t-dest" value="${t.destination}" placeholder="📍 Destination (e.g. Paris, France)" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);outline:none;background:#FAFAFA;margin-bottom:9px;"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;">
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">✈️ Departure</div>
          <input id="t-start" type="date" value="${t.startDate}" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        </div>
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">🏠 Return</div>
          <input id="t-end" type="date" value="${t.endDate}" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        </div>
      </div>
      ${nights?`<div style="text-align:center;font-size:12px;font-weight:800;color:#3870A8;background:#EEF4FF;border-radius:10px;padding:7px;">🌙 ${nights} night${nights>1?"s":""}</div>`:""}
    </div>

    <!-- Notes -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(140,160,200,.07);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:7px;">📝 Trip Notes</div>
      <textarea id="t-notes" style="width:100%;border:none;background:#FAFAFA;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);outline:none;resize:none;min-height:90px;line-height:1.7;" placeholder="Hotel details, booking refs, must-see places, budget, visa info..." onkeydown="event.stopPropagation()">${t.notes||""}</textarea>
    </div>
    <button onclick="saveTripOverview('${t.id}')" style="width:100%;background:linear-gradient(135deg,#A8C8E8,#88B8D8);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:900;color:#1A3858;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 12px rgba(100,140,200,.25);">💾 Save Trip Details</button>

// ── PACKING TAB ──────────────────────────────────────────────────────────────
function renderTripPacking(t,header){
  const pack=t.packingList||{};
  const totalItems=PACK_CATS.reduce((s,c)=>{
    const catItems=pack[c.key]||{};
    return s+Object.keys(catItems).length;
  },0)+(pack._custom||[]).length;
  const doneItems=PACK_CATS.reduce((s,c)=>{
    const catItems=pack[c.key]||{};
    return s+Object.values(catItems).filter(v=>v).length;
  },0)+(pack._custom||[]).filter(i=>i.done).length;
  const pct=totalItems?Math.round(doneItems/totalItems*100):0;

  function catSection(cat){
    const catItems=pack[cat.key]||{};
    const rows=cat.items.map(item=>{
      const key=item.replace(/[^a-z0-9]/gi,"_");
      const done=catItems[key]||false;
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(200,220,240,.15);">
        <div onclick="togglePackItem('${t.id}','${cat.key}','${key}',${!done})" style="width:22px;height:22px;border-radius:50%;border:2px solid ${done?"transparent":"#A8C8D8"};background:${done?"linear-gradient(135deg,#A8C8E8,#88B8D8)":"white"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;transition:all .18s;">${done?"✓":""}</div>
        <span style="font-size:13px;font-weight:700;color:${done?"var(--ink-light)":"var(--ink)"};${done?"text-decoration:line-through;":""}flex:1;">${item}</span>
      </div>`;
    }).join("");
    const doneCat=Object.values(catItems).filter(v=>v).length;
    const totalCat=cat.items.length;
    return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 8px rgba(140,160,200,.07);">
      <div style="padding:10px 14px 8px;background:linear-gradient(135deg,#EEF4FF,#E8F0FF);border-bottom:1px solid #EEE0EC;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12px;font-weight:900;color:#3870A8;">${cat.name}</div>
        <span style="font-size:10px;font-weight:800;color:${doneCat===totalCat?"var(--mint-d)":"#3870A8"};">${doneCat}/${totalCat} ${doneCat===totalCat?"✓":""}</span>
      </div>
      <div style="padding:4px 14px 8px;">${rows}</div>
    </div>`;
  }

  // Custom items
  const customItems=pack._custom||[];
  const customRows=customItems.map((item,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(200,220,240,.15);">
      <div onclick="toggleCustomPackItem('${t.id}',${i},${!item.done})" style="width:22px;height:22px;border-radius:50%;border:2px solid ${item.done?"transparent":"#A8C8D8"};background:${item.done?"linear-gradient(135deg,#A8C8E8,#88B8D8)":"white"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;transition:all .18s;">${item.done?"✓":""}</div>
      <span style="flex:1;font-size:13px;font-weight:700;color:${item.done?"var(--ink-light)":"var(--ink)"};${item.done?"text-decoration:line-through;":""}">${item.text}</span>
      <button onclick="deleteCustomPackItem('${t.id}',${i})" style="background:none;border:none;color:#D8C0C8;cursor:pointer;font-size:13px;">✕</button>
    </div>`).join("");

  document.getElementById("pageInner").innerHTML=header+`
    <!-- Progress -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(140,160,200,.07);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);">🧳 Packing Progress</div>
        <div style="font-size:13px;font-weight:900;color:#3870A8;">${doneItems}/${totalItems} · ${pct}%</div>
      </div>
      <div style="height:8px;background:#EEF4FF;border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#A8C8E8,#68A8D8);border-radius:4px;transition:width .4s;"></div>
      </div>
    </div>

    ${PACK_CATS.map(c=>catSection(c)).join("")}

    <!-- Custom items -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(140,160,200,.07);">
      <div style="padding:10px 14px 8px;background:linear-gradient(135deg,#EEF4FF,#E8F0FF);border-bottom:1px solid #EEE0EC;">
        <div style="font-size:12px;font-weight:900;color:#3870A8;">✦ Custom Items</div>
      </div>
      <div style="padding:4px 14px 8px;">${customRows||`<div style="font-size:12px;font-weight:600;color:var(--ink-light);padding:8px 0;">Add your own items below</div>`}</div>
      <div style="padding:0 14px 12px;display:flex;gap:8px;">
        <input id="pack-custom-input" style="flex:1;border:1.5px solid #EEE0EC;border-radius:24px;padding:8px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;" placeholder="Add item..." onkeydown="if(event.key==='Enter'){event.stopPropagation();addCustomPackItem('${t.id}')}"/>
        <button onclick="addCustomPackItem('${t.id}')" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#A8C8E8,#88B8D8);border:none;color:#1A3858;font-size:18px;cursor:pointer;flex-shrink:0;">+</button>
      </div>
    </div>
  `;
}

// ── ITINERARY TAB ────────────────────────────────────────────────────────────
function renderTripItinerary(t,header){
  const itin=t.itinerary||[];

  function dayCard(day,di){
    const dt=new Date(day.date+"T12:00:00");
    const dayLabel=dt.toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric"});
    const slots=day.slots||[];
    return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(140,160,200,.08);">
      <div style="background:linear-gradient(135deg,#A8C8E8,#88B8D8);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:10px;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.75);">DAY ${di+1}</div>
          <div style="font-size:14px;font-weight:900;color:white;">${dayLabel}</div>
        </div>
        <button onclick="deleteItinDay('${t.id}',${di})" style="background:rgba(255,255,255,.2);border:none;border-radius:50%;width:28px;height:28px;color:white;cursor:pointer;font-size:12px;">✕</button>
      </div>
      <div style="padding:8px 14px 4px;">
        ${slots.length?slots.map((s,si)=>`
          <div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(200,220,240,.15);">
            <div style="width:48px;flex-shrink:0;text-align:right;font-size:10px;font-weight:800;color:#3870A8;padding-top:2px;">${s.time||""}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:800;color:var(--ink);">${s.activity}</div>
              ${s.notes?`<div style="font-size:11px;font-weight:600;color:var(--ink-light);margin-top:2px;">${s.notes}</div>`:""}
            </div>
            <button onclick="deleteItinSlot('${t.id}',${di},${si})" style="background:none;border:none;color:#D8C0C8;cursor:pointer;font-size:12px;flex-shrink:0;">✕</button>
          </div>`).join("")
        :`<div style="font-size:12px;font-weight:600;color:var(--ink-light);padding:8px 0;">Nothing planned yet — add below</div>`}
      </div>
      <!-- Add slot -->
      <div style="padding:6px 14px 12px;display:flex;gap:7px;align-items:center;border-top:1px solid #EEF4FF;">
        <input placeholder="Time" style="width:58px;border:1.5px solid #EEE0EC;border-radius:8px;padding:7px 6px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;text-align:center;" id="itin-time-${di}" value="9:00 AM"/>
        <input placeholder="Activity or place..." style="flex:1;border:1.5px solid #EEE0EC;border-radius:8px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;" id="itin-act-${di}" onkeydown="if(event.key==='Enter'){event.stopPropagation();addItinSlot('${t.id}',${di})}"/>
        <button onclick="addItinSlot('${t.id}',${di})" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#A8C8E8,#88B8D8);border:none;color:#1A3858;font-size:18px;cursor:pointer;flex-shrink:0;">+</button>
      </div>
    </div>`;
  }

  document.getElementById("pageInner").innerHTML=header+`
    <!-- Add day -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(140,160,200,.07);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:8px;">➕ Add Day</div>
      <div style="display:flex;gap:8px;">
        <input id="itin-new-date" type="date" value="${t.startDate||tds()}" style="flex:1;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        <button onclick="addItinDay('${t.id}')" style="background:linear-gradient(135deg,#A8C8E8,#88B8D8);border:none;border-radius:10px;padding:8px 16px;font-size:12px;font-weight:900;color:#1A3858;cursor:pointer;font-family:'Nunito',sans-serif;">Add Day</button>
      </div>
    </div>

    ${itin.length===0?`<div style="text-align:center;padding:36px 20px;"><div style="font-size:44px;margin-bottom:12px;">🗺️</div><div style="font-family:'Dancing Script',cursive;font-size:18px;color:var(--ink-light);">No days planned yet</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:6px;">Add your first day above 🌸</div></div>`
    :itin.sort((a,b)=>a.date.localeCompare(b.date)).map((day,di)=>dayCard(day,di)).join("")}
  `;
}

// ── TRAVEL DIARY TAB ─────────────────────────────────────────────────────────
function renderTripDiary(t,header){
  const days=(t.diaryDays||[]).sort((a,b)=>b.date.localeCompare(a.date));

  function diaryCard(day){
    const dt=new Date(day.date+"T12:00:00");
    const label=dt.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"});
    const photos=(day.photos||[]).filter(Boolean);
    return`<div onclick="curDiaryDay='${day.date}';renderTripDetail('${t.id}')"
      style="background:white;border:1.5px solid #EEE0EC;border-radius:18px;overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 10px rgba(140,160,200,.08);transition:all .18s;"
      onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
      ${photos.length?`<div style="display:grid;grid-template-columns:${photos.length===1?"1fr":photos.length===2?"1fr 1fr":photos.length===3?"2fr 1fr":"1fr 1fr"};gap:2px;height:${photos.length===1?"160px":"130px"};">
        ${photos.slice(0,photos.length===3?3:4).map((p,pi)=>`<div style="${photos.length===3&&pi===0?"grid-row:span 2;":""};overflow:hidden;"><img src="${p}" style="width:100%;height:100%;object-fit:cover;" alt=""/></div>`).join("")}
      </div>`:""}
      <div style="padding:12px 14px;">

// ── Travel helpers ────────────────────────────────────────────────────────────
function deleteTrip(id){if(!confirm("Delete this trip and all its data?"))return;saveTrips(travelTrips().filter(t=>t.id!==id));curTrip=null;renderTravel();}

function loadTripCover(event,id){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const trips=travelTrips();const t=trips.find(t=>t.id===id);if(t)t.coverPhoto=e.target.result;
    saveTrips(trips);renderTripDetail(id);
  };reader.readAsDataURL(file);
}

function saveTripOverview(id){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  t.emoji=document.getElementById("t-emoji")?.value||t.emoji;
  t.name=document.getElementById("t-name")?.value||t.name;
  t.destination=document.getElementById("t-dest")?.value||"";
  t.startDate=document.getElementById("t-start")?.value||"";
  t.endDate=document.getElementById("t-end")?.value||"";
  t.notes=document.getElementById("t-notes")?.value||"";
  saveTrips(trips);showToast("Trip saved! ✈️");
}

function togglePackItem(id,cat,key,val){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.packingList)t.packingList={};
  if(!t.packingList[cat])t.packingList[cat]={};
  t.packingList[cat][key]=val;saveTrips(trips);travelTab="packing";renderTripDetail(id);
}
function addCustomPackItem(id){
  const inp=document.getElementById("pack-custom-input");const text=inp?.value?.trim();if(!text)return;
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.packingList)t.packingList={};if(!t.packingList._custom)t.packingList._custom=[];
  t.packingList._custom.push({text,done:false});saveTrips(trips);travelTab="packing";renderTripDetail(id);
}
function toggleCustomPackItem(id,idx,val){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t||!t.packingList?._custom)return;
  t.packingList._custom[idx].done=val;saveTrips(trips);travelTab="packing";renderTripDetail(id);
}
function deleteCustomPackItem(id,idx){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t||!t.packingList?._custom)return;
  t.packingList._custom.splice(idx,1);saveTrips(trips);travelTab="packing";renderTripDetail(id);
}

function addItinDay(id){
  const date=document.getElementById("itin-new-date")?.value||tds();
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.itinerary)t.itinerary=[];
  if(t.itinerary.find(d=>d.date===date)){showToast("Day already added!");return;}
  t.itinerary.push({date,slots:[]});saveTrips(trips);travelTab="itinerary";renderTripDetail(id);
}
function addItinSlot(id,di){
  const time=document.getElementById(`itin-time-${di}`)?.value||"";
  const act=document.getElementById(`itin-act-${di}`)?.value?.trim()||"";if(!act)return;
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t||!t.itinerary[di])return;
  if(!t.itinerary[di].slots)t.itinerary[di].slots=[];
  t.itinerary[di].slots.push({time,activity:act,notes:""});saveTrips(trips);travelTab="itinerary";renderTripDetail(id);
}
function deleteItinDay(id,di){const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;t.itinerary.splice(di,1);saveTrips(trips);travelTab="itinerary";renderTripDetail(id);}
function deleteItinSlot(id,di,si){const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t||!t.itinerary[di])return;t.itinerary[di].slots.splice(si,1);saveTrips(trips);travelTab="itinerary";renderTripDetail(id);}

function addDiaryDay(id){
  const date=tds();const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.diaryDays)t.diaryDays=[];
  if(!t.diaryDays.find(d=>d.date===date))t.diaryDays.push({date,photos:[],mood:"",weather:"",title:"",journal:""});
  saveTrips(trips);curDiaryDay=date;travelTab="diary";renderTripDetail(id);
}
function setTravelDiaryField(id,date,field,val){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.diaryDays)t.diaryDays=[];
  const day=t.diaryDays.find(d=>d.date===date);if(day)day[field]=val;
  saveTrips(trips);curDiaryDay=date;travelTab="diary";renderTripDetail(id);
}
function addTripPhoto(event,id,date,slot){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
    if(!t.diaryDays)t.diaryDays=[];
    let day=t.diaryDays.find(d=>d.date===date);
    if(!day){day={date,photos:[],mood:"",weather:"",title:"",journal:""};t.diaryDays.push(day);}
    if(!day.photos)day.photos=[];
    day.photos[slot]=e.target.result;
    saveTrips(trips);curDiaryDay=date;travelTab="diary";renderTripDetail(id);
  };reader.readAsDataURL(file);
}
function removeTripPhoto(id,date,slot){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  const day=t.diaryDays?.find(d=>d.date===date);if(day&&day.photos)day.photos[slot]=null;
  saveTrips(trips);curDiaryDay=date;travelTab="diary";renderTripDetail(id);
}
function saveTravelDiaryDay(id,date){
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  if(!t.diaryDays)t.diaryDays=[];
  let day=t.diaryDays.find(d=>d.date===date);
  if(!day){day={date,photos:[],mood:"",weather:"",title:"",journal:""};t.diaryDays.push(day);}
  day.title=document.getElementById("td-title")?.value||"";
  day.journal=document.getElementById("td-journal")?.value||"";
  saveTrips(trips);showToast("Entry saved! 🌸");curDiaryDay=null;travelTab="diary";renderTripDetail(id);
}
function deleteDiaryDay(id,date){
  if(!confirm("Delete this diary entry?"))return;
  const trips=travelTrips();const t=trips.find(t=>t.id===id);if(!t)return;
  t.diaryDays=(t.diaryDays||[]).filter(d=>d.date!==date);
  saveTrips(trips);curDiaryDay=null;travelTab="diary";renderTripDetail(id);
}

  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}

// Pomodoro state (persists across renders since these are module-level)
let pomState="idle",pomSeconds=25*60,pomTotal=25*60,pomTimer=null,pomSession=0;
let pomWorkMins=25,pomBreakMins=5,pomLongMins=15;
let editingPlaylistIdx=null; // inline edit state

function pomTick(){
  pomSeconds--;updatePomDisplay();
  if(pomSeconds<=0){
    clearInterval(pomTimer);pomTimer=null;
    if(pomState==="work"){pomSession++;pomState=pomSession%4===0?"longbreak":"break";pomTotal=pomSeconds=(pomState==="longbreak"?pomLongMins:pomBreakMins)*60;playPomSound("break");}
    else{pomState="work";pomTotal=pomSeconds=pomWorkMins*60;playPomSound("work");}
    startPomTimer();updatePomDisplay();
  }
}
function startPomTimer(){if(pomTimer)clearInterval(pomTimer);pomTimer=setInterval(pomTick,1000);}
function pomStart(){if(pomState==="idle"){pomState="work";pomTotal=pomSeconds=pomWorkMins*60;}startPomTimer();updatePomDisplay();}
function pomPause(){clearInterval(pomTimer);pomTimer=null;updatePomDisplay();}
function pomReset(){clearInterval(pomTimer);pomTimer=null;pomState="idle";pomSession=0;pomSeconds=pomTotal=pomWorkMins*60;updatePomDisplay();}
function pomSkip(){
  clearInterval(pomTimer);pomTimer=null;
  if(pomState==="work"){pomSession++;pomState=pomSession%4===0?"longbreak":"break";pomTotal=pomSeconds=(pomState==="longbreak"?pomLongMins:pomBreakMins)*60;}
  else{pomState="work";pomTotal=pomSeconds=pomWorkMins*60;}
  updatePomDisplay();
}
function playPomSound(type){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=type==="break"?880:440;osc.type="sine";g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);osc.start();osc.stop(ctx.currentTime+0.8);}catch(e){}
}
function pomColor(){return{idle:"var(--lavender)",work:"#D06060",break:"var(--mint)",longbreak:"var(--rose)"}[pomState]||"var(--lavender)";}
function pomLabel(){return{idle:"Ready to focus",work:"Focus Time 🍅",break:"Short Break ☕",longbreak:"Long Break 🌸"}[pomState]||"";}

function updatePomDisplay(){
  const mm=String(Math.floor(pomSeconds/60)).padStart(2,"0");
  const ss=String(pomSeconds%60).padStart(2,"0");
  const pct=pomSeconds/pomTotal;
  const r=54;const circ=2*Math.PI*r;
  const timeEl=document.getElementById("pom-time");
  const labelEl=document.getElementById("pom-label");
  const arcEl=document.getElementById("pom-arc");
  const startBtn=document.getElementById("pom-start");
  const pauseBtn=document.getElementById("pom-pause");
  const sessEl=document.getElementById("pom-sessions");
  if(timeEl)timeEl.textContent=`${mm}:${ss}`;
  if(labelEl){labelEl.textContent=pomLabel();labelEl.style.color=pomColor();}
  if(arcEl){arcEl.style.strokeDasharray=`${pct*circ} ${circ}`;arcEl.style.stroke=pomColor();}
  if(startBtn)startBtn.style.display=pomTimer?"none":"flex";
  if(pauseBtn)pauseBtn.style.display=pomTimer?"flex":"none";
  if(sessEl)sessEl.textContent=`${pomSession} session${pomSession!==1?"s":""} completed`;
}

      </div>
      <!-- Timer settings -->

      ${playlist.map((v,i)=>playlistRow(v,i)).join("")}
      <!-- Add video form -->
      <div style="padding:12px 14px;border-top:1px dashed #EEE0EC;">
        <div style="font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:7px;">➕ Add Video</div>
        <input id="yt-url-in" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;margin-bottom:7px;transition:border-color .2s;" placeholder="Paste any YouTube URL..." onfocus="this.style.borderColor='#9878B8'" onblur="this.style.borderColor='#EEE0EC'" onkeydown="if(event.key==='Enter'){event.stopPropagation();addToPlaylist()}"/>
        <input id="yt-title-in" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;margin-bottom:9px;" placeholder="Video title..." onkeydown="if(event.key==='Enter'){event.stopPropagation();addToPlaylist()}"/>
        <button onclick="addToPlaylist()" style="width:100%;background:linear-gradient(135deg,#C8B8E8,#A898D0);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(180,140,210,.3);">🎵 Add to Playlist</button>
      </div>
    </div>
  `;
}

function addToPlaylist(){
  const urlEl=document.getElementById("yt-url-in");
  const titleEl=document.getElementById("yt-title-in");
  const url=urlEl?.value?.trim();
  if(!url){urlEl?.focus();return;}
  const id=ytID(url);
  if(!id){showToast("⚠️ Couldn't find a YouTube video ID in that link");return;}
  const list=focusPlaylist();
  if(list.find(v=>v.id===id)){showToast("Already in playlist! 🎵");return;}
  const title=titleEl?.value?.trim()||url;
  list.push({id,title,url});
  saveFocusPlaylist(list);
  if(urlEl)urlEl.value="";
  if(titleEl)titleEl.value="";
  showToast("Added to playlist 🎵");
  editingPlaylistIdx=null;
  renderFocus();
}

function savePlaylistTitle(i){
  const titleEl=document.getElementById(`edit-title-${i}`);
  const urlEl=document.getElementById(`edit-url-${i}`);
  const list=focusPlaylist();
  if(!list[i])return;
  const newTitle=titleEl?.value?.trim();
  const newUrl=urlEl?.value?.trim();
  if(newTitle)list[i].title=newTitle;
  if(newUrl){
    const newId=ytID(newUrl);
    if(newId){list[i].id=newId;list[i].url=newUrl;}
  }
  saveFocusPlaylist(list);
  editingPlaylistIdx=null;
  renderFocus();
}

function removeFromPlaylist(i){
  const list=focusPlaylist();
  list.splice(i,1);
  saveFocusPlaylist(list);
  editingPlaylistIdx=null;
  renderFocus();
}

function saveBR(id){
  const isNew=!bibleReflections().find(e=>e.id===id);
  const all=bibleReflections().filter(e=>e.id!==id);
  all.push({
    id,
    date:document.getElementById("br-date")?.value||tds(),
    reference:document.getElementById("br-ref")?.value?.trim()||"",
    verse:document.getElementById("br-verse")?.value||"",
    observation:document.getElementById("br-obs")?.value||"",
    application:document.getElementById("br-app")?.value||"",
    prayer:document.getElementById("br-prayer")?.value||"",
  });
  saveBibleReflections(all);
  showToast("Reflection saved 🙏");
  curBREntry=null;
  renderBibleReflect();
}
function deleteBR(id){
  if(!confirm("Delete this reflection?"))return;
  saveBibleReflections(bibleReflections().filter(e=>e.id!==id));
  curBREntry=null;
  renderBibleReflect();
}

      }).join("")}
