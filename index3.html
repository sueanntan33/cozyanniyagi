}

// ── CALENDAR VIEW ─────────────────────────────────────────────────────────────
function renderSocialCalendar(tabBar){
  const mi=socialCalMonth;
  const m=MONTHS[mi];
  const posts=socialPosts().filter(p=>p.postDate&&p.postDate.startsWith(`2026-${String(mi+1).padStart(2,"0")}`));

  // Group by day
  const byDay={};
  posts.forEach(p=>{const d=parseInt(p.postDate.split("-")[2]);(byDay[d]=byDay[d]||[]).push(p);});

  // Build 7-col calendar
  const DAY_HDRS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let calHtml=`<div style="background:white;border:1.5px solid #F0D0E0;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(220,100,160,.08);">`;
  calHtml+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid #F0D0E0;">`;
  DAY_HDRS.forEach(d=>{calHtml+=`<div style="padding:7px 2px;text-align:center;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--rose-dark);background:#FFF0F6;">${d}</div>`;});
  calHtml+=`</div>`;

  const totalRows=Math.ceil((m.start+m.days)/7);
  for(let row=0;row<totalRows;row++){
    calHtml+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);">`;
    for(let col=0;col<7;col++){
      const idx=row*7+col;
      const dayNum=idx-m.start+1;
      const valid=dayNum>=1&&dayNum<=m.days;
      const dayPosts=valid?(byDay[dayNum]||[]):[];
      const isToday=valid&&new Date(2026,mi,dayNum).toDateString()===new Date().toDateString();
      const borderR=col<6?"border-right:1px solid #F8E8F0;":"";
      const borderB=row<totalRows-1?"border-bottom:1px solid #F8E8F0;":"";
      calHtml+=`<div style="min-height:60px;padding:4px;${borderR}${borderB}background:${valid?"white":"#FDF8FD"};position:relative;min-width:0;overflow:hidden;">`;
      if(valid){
        calHtml+=`<div style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:${isToday?"900":"700"};color:${isToday?"white":"var(--ink-light)"};background:${isToday?"linear-gradient(135deg,#F0A8C0,#D870A8)":"transparent"};margin-bottom:2px;">${dayNum}</div>`;
        dayPosts.slice(0,2).forEach(p=>{
          const tp=IG_POST_TYPES.find(t=>t.key===p.type)||IG_POST_TYPES[0];
          const title=(p.caption||"Post").slice(0,8)+"…";
          calHtml+=`<div style="width:100%;background:${tp.color}22;border-left:2.5px solid ${tp.color};border-radius:0 4px 4px 0;padding:1px 3px;margin-bottom:1px;font-size:8px;font-weight:800;color:${tp.color};overflow:hidden;white-space:nowrap;text-overflow:clip;max-width:100%;box-sizing:border-box;">${title}</div>`;
        });
        if(dayPosts.length>2)calHtml+=`<div style="font-size:8px;font-weight:800;color:var(--ink-light);">+${dayPosts.length-2}</div>`;
      }
      calHtml+=`</div>`;
    }
    calHtml+=`</div>`;
  }
  calHtml+=`</div>`;

  const scheduled=posts.filter(p=>p.status==="scheduled"||p.status==="ready").length;
  const posted=posts.filter(p=>p.status==="posted").length;

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">📅 Content Calendar</div>
    <div class="section-sub">Your Instagram posting plan 🌸</div>
    <div class="divider"></div>
    ${tabBar}
    <div class="nav-row" style="margin-bottom:12px;">
      ${mi>0?`<button class="nav-btn" onclick="socialCalMonth=${mi-1};renderSocial()">◀ ${MONTHS[mi-1].short}</button>`:`<div></div>`}
      <div style="font-size:13px;font-weight:900;color:var(--rose-dark);">${m.emoji} ${m.name} 2026</div>
      ${mi<11?`<button class="nav-btn" onclick="socialCalMonth=${mi+1};renderSocial()">${MONTHS[mi+1].short} ▶</button>`:`<div></div>`}
    </div>
    <!-- Month stats -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
      <div style="background:white;border:1.5px solid #EEE0EC;border-radius:12px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--rose-dark);">${posts.length}</div><div style="font-size:9px;font-weight:800;color:var(--ink-light);text-transform:uppercase;letter-spacing:.1em;">Total</div></div>
      <div style="background:#EDFFF8;border:1.5px solid #90C8A8;border-radius:12px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:#3A8860;">${posted}</div><div style="font-size:9px;font-weight:800;color:#3A8860;text-transform:uppercase;letter-spacing:.1em;">Posted</div></div>
      <div style="background:#EEF4FF;border:1.5px solid #90B8D8;border-radius:12px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:#3870A8;">${scheduled}</div><div style="font-size:9px;font-weight:800;color:#3870A8;text-transform:uppercase;letter-spacing:.1em;">Planned</div></div>
    </div>
    ${calHtml}
    <div style="font-size:11px;font-weight:700;color:var(--ink-light);text-align:center;">Tap ✦ Add New Post in Queue tab to add posts that appear here 🌸</div>
  `;
}

// ── Social helpers ─────────────────────────────────────────────────────────────
function savePost(id){
  const isNew=!id||id==="";
  const all=isNew?socialPosts():socialPosts().filter(p=>p.id!==id);
  const post={
    id:isNew?spUID():id,
    type:window._spType||"reel",
    caption:document.getElementById("sp-caption")?.value||"",
    hashtags:document.getElementById("sp-hashtags")?.value||"",
    contentType:document.getElementById("sp-ctype")?.value||"",
    status:document.getElementById("sp-status")?.value||"idea",
    postDate:document.getElementById("sp-date")?.value||tds(),
    time:document.getElementById("sp-time")?.value||"",
  };
  all.push(post);
  saveSocialPosts(all);
  editingPostId=null;
  showToast("Post saved 🌸");
  renderSocial();
}
function deletePost(id){
  if(!confirm("Delete this post?"))return;
  saveSocialPosts(socialPosts().filter(p=>p.id!==id));
  renderSocial();
}
function markPosted(id){
  const all=socialPosts();const p=all.find(p=>p.id===id);if(p)p.status="posted";
  saveSocialPosts(all);renderSocial();
}
function addIdea(){
  const text=document.getElementById("idea-text")?.value?.trim();if(!text)return;
  const type=document.getElementById("idea-type")?.value||"";
  const all=socialIdeas();
  all.unshift({text,type,created:Date.now()});
  saveSocialIdeas(all);
  document.getElementById("idea-text").value="";
  renderSocial();
}
function deleteIdea(i){
  const all=socialIdeas();all.splice(i,1);saveSocialIdeas(all);renderSocial();
}
function convertIdeaToPost(i){
  const idea=socialIdeas()[i];
  if(!idea)return;
  const all=socialPosts();
  all.unshift({id:spUID(),type:"reel",caption:idea.text,hashtags:"",contentType:idea.type||"",status:"idea",postDate:tds(),time:"09:00"});
  saveSocialPosts(all);
  const ideas=socialIdeas();ideas.splice(i,1);saveSocialIdeas(ideas);
  socialTab="queue";
  showToast("Added to queue 🌸");
  renderSocial();
}

function applyDarkMode(on){
  const r=document.documentElement;
  if(on){
    r.style.setProperty("--paper","#1E1628");
    r.style.setProperty("--ink","#F0E8F8");
    r.style.setProperty("--ink-mid","#C8B8D8");
    r.style.setProperty("--ink-light","#9880A8");
    r.style.setProperty("--blush","#3A2840");
    r.style.setProperty("--rose","#D870A8");
    r.style.setProperty("--rose-dark","#F0A8C0");
    r.style.setProperty("--rose-deep","#F8C8D8");
    r.style.setProperty("--lavender","#B8A8E0");
    r.style.setProperty("--mint","#80C8A8");
    r.style.setProperty("--gold","#D4B840");
    document.getElementById("journalScreen").style.background="linear-gradient(160deg,#120D18 0%,#1A1224 50%,#0E0C18 100%)";
    // dark topbar
    const tb=document.querySelector(".j-topbar");
    if(tb)tb.style.background="rgba(30,22,40,.92)";
    const ps=document.getElementById("pageShell");
    if(ps)ps.style.background="linear-gradient(160deg,#1E1628,#1A1430,#1C1228)";
    document.getElementById("darkToggle").textContent="☀️";
  } else {
    r.style.removeProperty("--paper");
    r.style.removeProperty("--ink");
    r.style.removeProperty("--ink-mid");
    r.style.removeProperty("--ink-light");
    r.style.removeProperty("--blush");
    r.style.removeProperty("--rose");
    r.style.removeProperty("--rose-dark");
    r.style.removeProperty("--rose-deep");
    r.style.removeProperty("--lavender");
    r.style.removeProperty("--mint");
    r.style.removeProperty("--gold");
    document.getElementById("journalScreen").style.background="linear-gradient(135deg,#FFF5FB 0%,#F8F0FF 50%,#F0F8FF 100%)";
    const tb=document.querySelector(".j-topbar");
    if(tb)tb.style.background="";
    const ps=document.getElementById("pageShell");
    if(ps)ps.style.background="";
    document.getElementById("darkToggle").textContent="🌙";
  }
}
function toggleDarkMode(){
  const on=!JSON.parse(ld("darkMode","false"));
  sv("darkMode",JSON.stringify(on));
  applyDarkMode(on);
  showSection(curSection); // re-render to pick up new colours
}
// Apply on startup
(function(){if(JSON.parse(ld("darkMode","false")))applyDarkMode(true);})();

const MOOD_OPTS=[

  {v:2,emoji:"😔",label:"Low",      color:"#F0C090"},

];
const MOOD_NOTES_PROMPTS=["What made today feel this way?","What would have made today better?","One thing I'm grateful for despite today...","What am I feeling in my body?"];

function moodLog(){return ldo("mood_log_v1");}
function saveMoodLog(o){svo("mood_log_v1",o);}

function renderMood(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.mood;
  const log=moodLog();
  const todayKey=tds();
  const todayMood=log[todayKey];

  // Build last 30 days for graph
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.toISOString().split("T")[0];
    days.push({k,v:log[k]?.v||0,emoji:log[k]?.emoji||"",d});
  }
  const avg=(days.filter(d=>d.v>0).reduce((s,d)=>s+d.v,0)/Math.max(1,days.filter(d=>d.v>0).length)).toFixed(1);
  const streak=(()=>{let s=0,d=new Date();while(true){const k=d.toISOString().split("T")[0];if(log[k]?.v){s++;d.setDate(d.getDate()-1);}else break;}return s;})();

  // Mood graph — 30 bars
  const maxH=52;
  const bars=days.map(day=>{
    const mo=MOOD_OPTS.find(m=>m.v===day.v);
    const h=day.v?Math.round(day.v/5*maxH):4;
    const isToday=day.k===todayKey;
    const label=day.d.getDate()===1?day.d.toLocaleDateString("en",{month:"short"}):"";
    return`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
      <div style="width:100%;max-width:14px;height:${maxH}px;display:flex;align-items:flex-end;justify-content:center;">
        <div style="width:${isToday?"12px":"8px"};height:${h}px;border-radius:4px 4px 2px 2px;background:${day.v?(mo?.color||"#C8B8E8"):"rgba(200,180,220,.2)"};transition:height .4s;${isToday?"box-shadow:0 0 6px rgba(240,160,192,.5);":""}"></div>
      </div>
      ${isToday?`<div style="font-size:9px;">${day.emoji||"·"}</div>`:`<div style="font-size:8px;color:var(--ink-light);">${label}</div>`}
    </div>`;
  }).join("");

  // Monthly mood heatmap (current month)
  const mi=new Date().getMonth();
  const m=MONTHS[mi];
  let heatCells="";
  const DAY_H=["S","M","T","W","T","F","S"];
  DAY_H.forEach(d=>heatCells+=`<div style="font-size:8px;font-weight:900;color:var(--ink-light);text-align:center;">${d}</div>`);
  for(let i=0;i<m.start;i++)heatCells+=`<div></div>`;
  for(let d=1;d<=m.days;d++){
    const k=`2026-${String(mi+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const entry=log[k];
    const mo=entry?MOOD_OPTS.find(x=>x.v===entry.v):null;
    const isToday=k===todayKey;
    heatCells+=`<div style="aspect-ratio:1;border-radius:6px;background:${mo?mo.color+"55":"rgba(200,180,220,.1)"};border:${isToday?"2px solid var(--rose)":"1px solid transparent"};display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;" title="${d}${mo?" · "+mo.label:""}" onclick="document.getElementById('mood-date').value='${k}';document.getElementById('mood-entry-box').style.display='block';">${mo?mo.emoji:d}</div>`;
  }

  // Today's entry or prompt
  const prompt=MOOD_NOTES_PROMPTS[new Date().getDay()%MOOD_NOTES_PROMPTS.length];

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">😊 Mood Tracker</div>
    <div class="section-sub">How are you feeling today? 🌸</div>
    <div class="divider"></div>

    <!-- Log today -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(180,120,160,.07);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">✦ Log Today's Mood</div>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-bottom:12px;">
        ${MOOD_OPTS.map(mo=>`<div onclick="logMood('${todayKey}',${mo.v},'${mo.emoji}')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;cursor:pointer;border:2.5px solid ${(todayMood?.v===mo.v)?"var(--rose)":"rgba(200,180,220,.2)"};background:${(todayMood?.v===mo.v)?mo.color+"22":"transparent"};transition:all .2s;">
          <div style="font-size:26px;">${mo.emoji}</div>
          <div style="font-size:9px;font-weight:900;color:${(todayMood?.v===mo.v)?mo.color:"var(--ink-light)"};">${mo.label}</div>
        </div>`).join("")}
      </div>
      <textarea id="mood-note-today" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);background:#FAFAFA;outline:none;resize:none;min-height:60px;line-height:1.65;" placeholder="${prompt}" onkeydown="event.stopPropagation()" oninput="saveMoodNote('${todayKey}',this.value)">${todayMood?.note||""}</textarea>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
      ${[
        {v:streak+"d",  l:"Streak",       c:"var(--rose)"},
        {v:avg,          l:"Avg (30d)",    c:"var(--lavender)"},
        {v:Object.keys(log).length, l:"Days Logged", c:"var(--mint)"},
      ].map(s=>`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(180,120,160,.05);">

        <div style="font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-top:4px;">${s.l}</div>
      </div>`).join("")}
    </div>

    <!-- 30-day bar chart -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">📊 Last 30 Days</div>
      <div style="display:flex;gap:2px;align-items:flex-end;height:${maxH+20}px;">${bars}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        ${MOOD_OPTS.slice().reverse().map(mo=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink-light);">
          <div style="width:8px;height:8px;border-radius:50%;background:${mo.color};"></div>${mo.label}
        </div>`).join("")}
      </div>
    </div>

    <!-- Monthly heatmap -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">📅 ${m.name} at a Glance</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${heatCells}</div>
    </div>

    <!-- Past entry editor (hidden by default) -->
    <div id="mood-entry-box" style="display:none;background:linear-gradient(135deg,#FFF0F6,#F8F0FF);border:1.5px solid #F0C8D8;border-radius:16px;padding:13px 14px;margin-bottom:14px;">
      <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-dark);margin-bottom:10px;">✏️ Edit Entry</div>

      <div style="display:flex;gap:8px;justify-content:space-between;margin-bottom:10px;">
        ${MOOD_OPTS.map(mo=>`<div onclick="window._editMoodV=${mo.v};window._editMoodE='${mo.emoji}';document.querySelectorAll('.edit-mood-btn').forEach(d=>{d.style.border='2.5px solid transparent';d.style.background='transparent';});this.style.border='2.5px solid var(--rose)';this.style.background='${mo.color}22'" class="edit-mood-btn" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px;border-radius:12px;cursor:pointer;border:2.5px solid transparent;transition:all .15s;">
          <div style="font-size:22px;">${mo.emoji}</div>
          <div style="font-size:9px;font-weight:800;color:var(--ink-light);">${mo.label}</div>
        </div>`).join("")}
      </div>
      <div style="display:flex;gap:8px;">
        <button onclick="savePastMood()" style="flex:2;background:linear-gradient(135deg,#C8B8E8,#A898D0);border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;">💾 Save</button>

}

  const key=document.getElementById("mood-date")?.value;

function savePrayerRequest(id){
  const isNew=!id||id==="";
  const all=isNew?prayerRequests():prayerRequests().filter(p=>p.id!==id);
  all.unshift({
    id:isNew?prUID():id,
    request:document.getElementById("pr-request")?.value?.trim()||"",
    scripture:document.getElementById("pr-scripture")?.value?.trim()||"",
    category:document.getElementById("pr-cat")?.value||"",
    status:document.getElementById("pr-status")?.value||"praying",
    date:document.getElementById("pr-date")?.value||tds(),
    notes:document.getElementById("pr-notes")?.value||"",
  });
  savePrayer(all);
  editingPrayerId=null;
  showToast("Prayer saved 🙏");
  renderPrayer();
}
function deletePrayerRequest(id){
  if(!confirm("Delete this prayer?"))return;
  savePrayer(prayerRequests().filter(p=>p.id!==id));
  renderPrayer();
}
function markAnswered(id){
  const all=prayerRequests();const p=all.find(p=>p.id===id);
  if(!p)return;
  p.status="answered";p.answeredDate=tds();
  const testimony=prompt("Add a testimony (optional) — how did God answer?");
  if(testimony)p.testimony=testimony;
  savePrayer(all);showToast("🌟 Praise God!");renderPrayer();
}
function updatePrayerStatus(id,status){
  const all=prayerRequests();const p=all.find(p=>p.id===id);
  if(p){p.status=status;savePrayer(all);renderPrayer();}
}

// ── TAGS / LABELS ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const TAG_COLORS=["#F0A8C0","#B4A8D8","#90C8A8","#F0C090","#90B8D8","#F0A8A8","#C8A8E0","#D4A840","#A8C8E8","#D08090"];
const DEFAULT_TAGS=[
  {name:"work",    color:"#90B8D8"},
  {name:"personal",color:"#F0A8C0"},
  {name:"faith",   color:"#D4A840"},
  {name:"health",  color:"#90C8A8"},
  {name:"urgent",  color:"#F0A8A8"},
];

function allTags(){
  try{const t=JSON.parse(ld("journal_tags","null"));return t||DEFAULT_TAGS;}catch(e){return DEFAULT_TAGS;}
}
function saveTags(a){sv("journal_tags",JSON.stringify(a));}

function toggleTaskTag(taskId,tagName){
  const todos=lda("todos");
  const t=todos.find(t=>t.id===taskId);
  if(!t)return;
  if(!t.tags)t.tags=[];
  const idx=t.tags.indexOf(tagName);
  if(idx>=0)t.tags.splice(idx,1);
  else t.tags.push(tagName);
  sva("todos",todos);
  closeTaskModal();openTaskModal(taskId);
}
function toggleGoalTag(goalId,tagName){
  const goals_=goals();
  const g=goals_.find(g=>g.id===goalId);
  if(!g)return;
  if(!g.tags)g.tags=[];
  const idx=g.tags.indexOf(tagName);
  if(idx>=0)g.tags.splice(idx,1);
  else g.tags.push(tagName);
  saveGoals(goals_);renderGoals();
}
function renderTags(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.search;
  const tags=allTags();
  // Count uses
  const todos=lda("todos");
  const goalsList=goals();
  function useCount(name){
    return todos.filter(t=>(t.tags||[]).includes(name)).length
         + goalsList.filter(g=>(g.tags||[]).includes(name)).length;
  }

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">🏷️ Tags & Labels</div>
    <div class="section-sub">Organise tasks and goals with coloured tags 🌸</div>
    <div class="divider"></div>

    <!-- Create tag -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:9px;">✦ Create New Tag</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="tag-name" placeholder="Tag name (no spaces)..." maxlength="20"
          style="flex:1;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"
          onkeydown="if(event.key==='Enter'){event.stopPropagation();addTag()}"/>
        <button onclick="addTag()" style="background:linear-gradient(135deg,#C8B8E8,#A898D0);border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;">+ Add</button>
      </div>
      <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">Colour</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" id="tag-color-row">
        ${TAG_COLORS.map((col,i)=>`<div onclick="window._newTagColor='${col}';document.querySelectorAll('#tag-color-row div').forEach(d=>{d.style.transform=d.dataset.c==='${col}'?'scale(1.25)':'scale(1)';})" data-c="${col}" style="width:24px;height:24px;border-radius:50%;background:${col};cursor:pointer;transition:transform .15s;transform:${i===0?"scale(1.25)":"scale(1)"};"></div>`).join("")}
      </div>
    </div>

    <!-- Existing tags -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${tags.length===0?`<div style="text-align:center;padding:28px;color:var(--ink-light);font-size:13px;font-weight:700;">No tags yet — create one above 🌸</div>`:""}
      ${tags.map((tag,i)=>`
        <div style="background:white;border:1.5px solid #EEE0EC;border-left:4px solid ${tag.color};border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(180,120,160,.05);">
          <div style="width:12px;height:12px;border-radius:50%;background:${tag.color};flex-shrink:0;"></div>
          <div style="flex:1;">
            <div style="font-size:14px;font-weight:900;color:var(--ink);">#${tag.name}</div>
            <div style="font-size:11px;font-weight:700;color:var(--ink-light);">${useCount(tag.name)} item${useCount(tag.name)!==1?"s":""}</div>
          </div>
          <button onclick="filterByTag('${tag.name}')" style="padding:5px 12px;border-radius:20px;background:${tag.color}22;border:1px solid ${tag.color};color:${tag.color};font-size:11px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;">Filter</button>
          <button onclick="deleteTag(${i})" style="width:28px;height:28px;border-radius:50%;background:#FFF0F0;border:none;cursor:pointer;font-size:13px;">🗑️</button>
        </div>`).join("")}
    </div>

    <div style="margin-top:20px;background:linear-gradient(135deg,#F8F0F8,#F0EEFF);border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--lavender);margin-bottom:7px;">💡 How to add tags</div>
      <div style="font-size:12px;font-weight:700;color:var(--ink-mid);line-height:1.7;">Open any task → tap ✏️ → the Tags section shows in the edit modal. Tap a tag to apply it. Tags appear as coloured pills on task cards.<br/><br/>Use Search (🔍) to filter by tag across the whole journal.</div>
    </div>
  `;
  window._newTagColor=TAG_COLORS[0];
}
function addTag(){
  const name=document.getElementById("tag-name")?.value?.trim().replace(/\s+/g,"").toLowerCase();
  if(!name)return;
  const tags=allTags();
  if(tags.find(t=>t.name===name)){showToast("Tag already exists!");return;}
  tags.push({name,color:window._newTagColor||TAG_COLORS[0]});
  saveTags(tags);
  document.getElementById("tag-name").value="";
  renderTags();
}
function deleteTag(i){
  if(!confirm("Delete this tag? It will be removed from all items."))return;
  const tags=allTags();
  const name=tags[i].name;
  tags.splice(i,1);
  saveTags(tags);
  // Remove from todos
  const todos=lda("todos");
  todos.forEach(t=>{if(t.tags)t.tags=t.tags.filter(x=>x!==name);});
  sva("todos",todos);
  // Remove from goals
  const gl=goals();
  gl.forEach(g=>{if(g.tags)g.tags=g.tags.filter(x=>x!==name);});
  saveGoals(gl);
  renderTags();
}
function filterByTag(name){
  // Jump to todo with this tag pre-filtered
  window._todoTagFilter=name;
  showSection("todo");
}

function renderSearch(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.search;
  const q=window._searchQuery||"";

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">🔍 Search</div>
    <div class="section-sub">Find anything across your journal 🌸</div>
    <div class="divider"></div>

    <!-- Search bar -->
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="search-input" value="${q.replace(/"/g,'&quot;')}" placeholder="Search tasks, goals, diary, prayers, reflections..."
        style="flex:1;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 16px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--ink);background:white;outline:none;box-shadow:0 2px 8px rgba(180,120,160,.08);"
        oninput="window._searchQuery=this.value;doSearch(this.value)"
        onkeydown="if(event.key==='Enter'){event.stopPropagation();doSearch(this.value)}"/>
      ${q?`<button onclick="window._searchQuery='';document.getElementById('search-input').value='';doSearch('')" style="background:white;border:1.5px solid #EEE0EC;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:800;color:var(--ink-light);cursor:pointer;">✕</button>`:""}
    </div>

    <!-- Tag filter shortcuts -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
      <div style="font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);align-self:center;">Tags:</div>
      ${allTags().map(tag=>`<div onclick="document.getElementById('search-input').value='#${tag.name}';window._searchQuery='#${tag.name}';doSearch('#${tag.name}')" style="font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;cursor:pointer;background:${tag.color}22;color:${tag.color};border:1px solid ${tag.color}44;transition:all .15s;">#${tag.name}</div>`).join("")}
    </div>

    <div id="search-results">${q?"":`<div style="text-align:center;padding:40px 16px;"><div style="font-size:40px;margin-bottom:12px;">🔍</div><div style="font-family:'Dancing Script',cursive;font-size:20px;color:var(--ink-light);">Type to search your journal</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:8px;">Tasks · Goals · Diary · Prayers · Bible reflections · Notes</div></div>`}</div>
  `;
  if(q)doSearch(q);
}

function doSearch(q){
  const resultsEl=document.getElementById("search-results");
  if(!resultsEl)return;
  q=(q||"").trim().toLowerCase();
  if(!q){resultsEl.innerHTML=`<div style="text-align:center;padding:32px;font-size:13px;font-weight:700;color:var(--ink-light);">Type to search 🔍</div>`;return;}

  const isTagSearch=q.startsWith("#");
  const tagQ=isTagSearch?q.slice(1):"";
  const results=[];

  // ── Search Tasks ──
  lda("todos").forEach(t=>{
    const match=!isTagSearch
      ?(t.text.toLowerCase().includes(q)||t.note?.toLowerCase().includes(q))
      :(t.tags||[]).some(tag=>tag.toLowerCase().includes(tagQ));
    if(match){
      const tagHtml=(t.tags||[]).map(tag=>{const td=allTags().find(x=>x.name===tag);return`<span style="background:${td?td.color+"33":"#F0E8F8"};color:${td?td.color:"var(--rose-dark)"};border-radius:20px;padding:1px 8px;font-size:10px;font-weight:800;">#${tag}</span>`;}).join("");
      results.push({type:"✅ Task",text:t.text,sub:t.done?"Done":"Active",extra:tagHtml,action:`openTaskModal('${t.id}')`,color:"#90B8D8"});
    }
  });

  // ── Search Goals ──
  goals().forEach(g=>{
    const match=!isTagSearch
      ?(g.title?.toLowerCase().includes(q)||g.why?.toLowerCase().includes(q)||g.notes?.toLowerCase().includes(q))
      :(g.tags||[]).some(tag=>tag.toLowerCase().includes(tagQ));
    if(match){
      const tagHtml=(g.tags||[]).map(tag=>{const td=allTags().find(x=>x.name===tag);return`<span style="background:${td?td.color+"33":"#F0E8F8"};color:${td?td.color:"var(--rose-dark)"};border-radius:20px;padding:1px 8px;font-size:10px;font-weight:800;">#${tag}</span>`;}).join("");
      results.push({type:"🎯 Goal",text:g.title||"Untitled goal",sub:`${g.status||"Active"} · ${g.progress||0}%`,extra:tagHtml,action:`showSection('goals')`,color:"var(--lavender)"});
    }
  });

  // ── Search Diary ──
  lda("diary_v1").forEach(e=>{
    if(!isTagSearch&&(e.notes?.toLowerCase().includes(q))){
      const dt=e.date?new Date(e.date+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric"}):"";
      const preview=(e.notes||"").slice(0,60)+"…";
      results.push({type:"📔 Diary",text:dt,sub:preview,extra:"",action:`curDiaryEntry='${e.id}';showSection('diary')`,color:"var(--rose)"});
    }
  });

  // ── Search Prayers ──
  prayerRequests().forEach(p=>{
    if(!isTagSearch&&(p.request?.toLowerCase().includes(q)||p.notes?.toLowerCase().includes(q))){
      results.push({type:"🙏 Prayer",text:p.request?.slice(0,60)||"Prayer",sub:p.status,extra:"",action:`prayerFilter='all';showSection('prayer')`,color:"#C8A840"});
    }
  });

  // ── Search Bible Reflections ──
  lda("bible_reflect_v1").forEach(e=>{
    if(!isTagSearch&&(e.reference?.toLowerCase().includes(q)||e.verse?.toLowerCase().includes(q)||e.observation?.toLowerCase().includes(q)||e.application?.toLowerCase().includes(q))){
      results.push({type:"✝️ Reflection",text:e.reference||"Bible Reflection",sub:(e.verse||"").slice(0,60)+"…",extra:"",action:`curBREntry='${e.id}';showSection('biblereflect')`,color:"#C8A840"});
    }
  });

  // ── Search Daily Journal ──
  for(let i=1;i<=365;i++){
    const j=ld("d_j_"+i);const pr=ld("d_pr_"+i);
    if(!isTagSearch){
      const hit=(j&&j.toLowerCase().includes(q))||(pr&&pr.toLowerCase().includes(q));
      if(hit){
        const dt=dateFromDOY&&dateFromDOY(i);
        const dStr=dt?dt.toLocaleDateString("en",{month:"short",day:"numeric"}):"Day "+i;
        const preview=(j||pr||"").slice(0,60)+"…";
        results.push({type:"📝 Daily",text:dStr,sub:preview,extra:"",action:`curDay=${i};showSection('days');renderDay(${i})`,color:"var(--rose)"});
      }
    }
  }

  // ── Search Notes (My Pages) ──
  lda("my_pages_v1").forEach(p=>{
    if(!isTagSearch&&(p.title?.toLowerCase().includes(q)||p.content?.toLowerCase().includes(q))){
      results.push({type:"📓 Note",text:p.title||"Untitled",sub:(p.content||"").slice(0,60)+"…",extra:"",action:`showSection('pages')`,color:"#B4A8D8"});
    }
  });

  if(results.length===0){
    resultsEl.innerHTML=`<div style="text-align:center;padding:40px 16px;"><div style="font-size:32px;margin-bottom:12px;">🔍</div><div style="font-size:14px;font-weight:800;color:var(--ink-light);">No results for "${q.replace(/"/g,"&quot;")}"</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:6px;">Try different words or check spelling</div></div>`;
    return;
  }

  resultsEl.innerHTML=`
    <div style="font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">${results.length} result${results.length!==1?"s":""}</div>
    ${results.map(r=>`
      <div onclick="${r.action}" style="background:white;border:1.5px solid #EEE0EC;border-left:4px solid ${r.color};border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 6px rgba(180,120,160,.05);transition:all .18s;" onmouseover="this.style.transform='translateX(3px)'" onmouseout="this.style.transform=''">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">
              <span style="font-size:10px;font-weight:900;background:${r.color}22;color:${r.color};border-radius:20px;padding:2px 9px;">${r.type}</span>
              ${r.extra}
            </div>
            <div style="font-size:13px;font-weight:800;color:var(--ink);line-height:1.3;">${r.text}</div>
            ${r.sub?`<div style="font-size:11px;font-weight:600;color:var(--ink-light);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.sub}</div>`:""}
          </div>
          <div style="color:var(--ink-light);font-size:16px;flex-shrink:0;">›</div>
        </div>
      </div>`).join("")}
  `;
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── FOOD LOG & CALORIE COUNTER ────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const MEALS=["🌅 Breakfast","☀️ Lunch","🌙 Dinner","🍎 Snacks","💧 Drinks"];

// Quick-search food database (name, calories per serving, serving)
const FOOD_DB=[
  // Breakfast

];

function foodLog(){return ldo("food_log_v1");}
function saveFoodLog(o){svo("food_log_v1",o);}

let foodDate=tds();
let foodSearchQ="";
let addingMeal=null; // which meal we're adding to

function renderFoodLog(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.foodlog;
  const log=foodLog();
  const dayData=log[foodDate]||{meals:{},goal:parseInt(ld("calorie_goal","2000"))};
  const goal=parseInt(ld("calorie_goal","2000"));

  // Calc totals
  let totalCals=0;
  MEALS.forEach(m=>{
    (dayData.meals[m]||[]).forEach(entry=>{totalCals+=entry.cals||0;});
  });
  const pct=Math.min(100,Math.round(totalCals/goal*100));
  const remaining=goal-totalCals;
  const barColor=pct>=100?"#D06060":pct>=80?"#D4A840":"#90C8A8";

  // Date nav helpers
  function prevDay(){const d=new Date(foodDate+"T12:00:00");d.setDate(d.getDate()-1);foodDate=d.toISOString().split("T")[0];renderFoodLog();}
  function nextDay(){const d=new Date(foodDate+"T12:00:00");d.setDate(d.getDate()+1);foodDate=d.toISOString().split("T")[0];renderFoodLog();}
  window.flPrev=prevDay;window.flNext=nextDay;

  const dt=new Date(foodDate+"T12:00:00");
  const dateLabel=dt.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"});
  const isToday=foodDate===tds();

  // Meal sections
  function mealSection(meal){
    const entries=dayData.meals[meal]||[];
    const mealCals=entries.reduce((s,e)=>s+e.cals,0);
    const col=MEAL_COLORS[meal]||"#F0E8EC";
    const isAdding=addingMeal===meal;

    const entryRows=entries.map((e,i)=>`
      <div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(200,220,200,.12);">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:800;color:var(--ink);">${e.name}</div>
          ${e.serving?`<div style="font-size:10px;font-weight:700;color:var(--ink-light);">${e.serving}</div>`:""}
        </div>
        <div style="font-size:13px;font-weight:900;color:#3A8060;flex-shrink:0;">${e.cals} kcal</div>
        <button onclick="removeFoodEntry('${foodDate}','${meal.replace(/'/g,"\\'")}',${i})" style="background:none;border:none;color:#D8C0C8;cursor:pointer;font-size:13px;flex-shrink:0;">✕</button>
      </div>`).join("");

    // Search results
    const searchHtml=isAdding?`<div style="padding:10px 0 4px;">
      <div style="display:flex;gap:7px;margin-bottom:8px;">
        <input id="food-search" value="${foodSearchQ}" placeholder="Search food or type custom..." style="flex:1;border:1.5px solid #B8D8C0;border-radius:10px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);background:white;outline:none;" oninput="foodSearchQ=this.value;renderFoodLog()" onkeydown="event.stopPropagation()"/>
        <button onclick="addingMeal=null;foodSearchQ='';renderFoodLog()" style="background:white;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;color:var(--ink-light);cursor:pointer;font-family:'Nunito',sans-serif;">✕</button>
      </div>
      ${foodSearchQ?`
        <div style="max-height:220px;overflow-y:auto;">
          ${FOOD_DB.filter(f=>f.n.toLowerCase().includes(foodSearchQ.toLowerCase())).slice(0,12).map(f=>`
            <div onclick="addFoodEntry('${foodDate}','${meal.replace(/'/g,"\\'")}','${f.n.replace(/'/g,"\\'")}',${f.c},'${f.s}')" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .12s;" onmouseover="this.style.background='rgba(144,200,168,.12)'" onmouseout="this.style.background=''">
              <div style="flex:1;"><div style="font-size:13px;font-weight:800;color:var(--ink);">${f.n}</div><div style="font-size:10px;font-weight:700;color:var(--ink-light);">${f.s}</div></div>
              <div style="font-size:12px;font-weight:900;color:#3A8060;flex-shrink:0;">${f.c} kcal</div>
              <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#A8D8C0,#80C8A0);display:flex;align-items:center;justify-content:center;font-size:16px;color:white;flex-shrink:0;">+</div>
            </div>`).join("")}
          ${FOOD_DB.filter(f=>f.n.toLowerCase().includes(foodSearchQ.toLowerCase())).length===0?`
            <div style="padding:6px 0 4px;font-size:12px;font-weight:700;color:var(--ink-light);">Not in database — add custom below</div>`:``}
        </div>
        <!-- Custom entry -->
        <div style="border-top:1px dashed #C8E8D0;padding-top:10px;margin-top:6px;">
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">✦ Custom entry</div>
          <div style="display:flex;gap:7px;">
            <input id="custom-cals" type="number" min="0" max="9999" placeholder="Calories" style="width:90px;border:1.5px solid #EEE0EC;border-radius:9px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--ink);background:white;outline:none;text-align:center;" onkeydown="event.stopPropagation()"/>
            <button onclick="addCustomFood('${foodDate}','${meal.replace(/'/g,"\\'")}','${foodSearchQ.replace(/'/g,"\\'")}');" style="flex:1;background:linear-gradient(135deg,#A8D8C0,#80C8A0);border:none;border-radius:9px;padding:7px;font-size:12px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;">+ Add "${foodSearchQ.slice(0,20)}"</button>
          </div>
        </div>`:`<div style="padding:8px 0;font-size:12px;font-weight:700;color:var(--ink-light);">Start typing to search 200+ foods...</div>`}
    </div>`:"";

    return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 8px rgba(144,200,168,.07);">
      <div style="background:${col}55;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid ${col};">
        <div style="font-size:12px;font-weight:900;color:var(--ink);">${meal}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${mealCals?`<span style="font-size:12px;font-weight:900;color:#3A8060;">${mealCals} kcal</span>`:""}
          <button onclick="addingMeal='${meal.replace(/'/g,"\\'")}';foodSearchQ='';renderFoodLog()" style="background:${col};border:none;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--ink);">+ Add</button>
        </div>
      </div>
      <div style="padding:0 14px;">
        ${entries.length?entryRows:`<div style="font-size:12px;font-weight:600;color:var(--ink-light);padding:10px 0;">Nothing logged yet</div>`}
        ${searchHtml}
      </div>
    </div>`;
  }

  // Weekly summary (last 7 days)
  const weekBars=(()=>{
    let bars="";
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const k=d.toISOString().split("T")[0];
      const dayLog=log[k]||{};
      let dayCals=0;
      MEALS.forEach(m=>{(dayLog.meals?.[m]||[]).forEach(e=>{dayCals+=e.cals||0;});});
      const h=Math.min(48,Math.round(dayCals/goal*48));
      const dayName=d.toLocaleDateString("en",{weekday:"short"});
      const isActive=k===foodDate;
      const barC=dayCals>=goal?"#D06060":dayCals>=goal*0.8?"#D4A840":"#90C8A8";
      bars+=`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;" onclick="foodDate='${k}';addingMeal=null;renderFoodLog()">
        <div style="width:100%;max-width:28px;height:48px;display:flex;align-items:flex-end;justify-content:center;">
          <div style="width:${isActive?"20px":"14px"};height:${Math.max(4,h)}px;border-radius:4px 4px 2px 2px;background:${dayCals?barC:"rgba(200,220,200,.2)"};transition:all .3s;${isActive?"box-shadow:0 0 6px rgba(90,180,120,.4);":""};"></div>
        </div>
        <div style="font-size:9px;font-weight:${isActive?"900":"700"};color:${isActive?"#3A8060":"var(--ink-light)"};">${dayName}</div>
        ${dayCals?`<div style="font-size:8px;font-weight:800;color:var(--ink-light);">${dayCals}</div>`:""}
      </div>`;
    }
    return bars;
  })();

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">🥗 Food Log</div>
    <div class="section-sub">Track your meals · count calories 🌱</div>
    <div class="divider"></div>

    <!-- Date nav -->
    <div class="nav-row" style="margin-bottom:12px;">
      <button class="nav-btn" onclick="flPrev()">◀</button>
      <div style="font-size:13px;font-weight:800;color:var(--ink);text-align:center;">${isToday?"Today 🌸":dateLabel}</div>
      <button class="nav-btn" onclick="flNext()">▶</button>
    </div>

    <!-- Calorie ring + stats -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:18px;padding:16px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(144,200,168,.08);">
      <div style="display:flex;align-items:center;gap:16px;">
        <!-- SVG ring -->
        <div style="position:relative;width:90px;height:90px;flex-shrink:0;">
          <svg width="90" height="90" viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="36" fill="none" stroke="#F0F8F0" stroke-width="9"/>
            <circle cx="45" cy="45" r="36" fill="none" stroke="${barColor}" stroke-width="9"
              stroke-dasharray="${pct*2.262} 226.2" stroke-linecap="round"
              transform="rotate(-90 45 45)" style="transition:stroke-dasharray .6s ease;"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--ink);line-height:1;">${totalCals}</div>
            <div style="font-size:9px;font-weight:800;color:var(--ink-light);">kcal</div>
          </div>
        </div>
        <!-- Breakdown -->
        <div style="flex:1;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
            <div style="background:#F0FFF8;border-radius:10px;padding:8px;text-align:center;">
              <div style="font-size:16px;font-weight:900;color:#3A8060;">${goal}</div>
              <div style="font-size:9px;font-weight:800;color:#3A8060;text-transform:uppercase;letter-spacing:.08em;">Goal</div>
            </div>
            <div style="background:${remaining<0?"#FFF0F0":"#F8FFF8"};border-radius:10px;padding:8px;text-align:center;">
              <div style="font-size:16px;font-weight:900;color:${remaining<0?"#D06060":"#3A8060"};">${Math.abs(remaining)}</div>
              <div style="font-size:9px;font-weight:800;color:${remaining<0?"#D06060":"#3A8060"};text-transform:uppercase;letter-spacing:.08em;">${remaining<0?"Over":"Left"}</div>
            </div>
          </div>
          <!-- Progress bar -->
          <div style="height:8px;background:#F0F8F0;border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#90C8A8,${barColor});border-radius:4px;transition:width .6s;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:5px;">
            <div style="font-size:10px;font-weight:700;color:var(--ink-light);">${pct}% of daily goal</div>
            <button onclick="document.getElementById('goal-edit-row').style.display='flex'" style="background:none;border:none;font-size:10px;font-weight:800;color:#3A8060;cursor:pointer;">✏️ Edit goal</button>
          </div>
          <div id="goal-edit-row" style="display:none;align-items:center;gap:7px;margin-top:8px;">
            <input id="goal-input" type="number" min="500" max="9999" value="${goal}" style="flex:1;border:1.5px solid #B8D8C0;border-radius:9px;padding:7px 11px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--ink);background:white;outline:none;text-align:center;" onkeydown="if(event.key==='Enter'){event.stopPropagation();sv('calorie_goal',parseInt(this.value)||2000);renderFoodLog();}"/>
            <button onclick="sv('calorie_goal',parseInt(document.getElementById('goal-input').value)||2000);renderFoodLog()" style="background:linear-gradient(135deg,#A8D8C0,#80C8A0);border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;">Save</button>
            <button onclick="document.getElementById('goal-edit-row').style.display='none'" style="background:white;border:1.5px solid #EEE0EC;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--ink-light);cursor:pointer;">✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Meal sections -->
    ${MEALS.map(m=>mealSection(m)).join("")}

    <!-- Weekly chart -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(144,200,168,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#3A8060;margin-bottom:10px;">📊 Last 7 Days</div>
      <div style="display:flex;gap:4px;align-items:flex-end;height:60px;">${weekBars}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <div style="display:flex;gap:10px;">
          ${[["#90C8A8","Under goal"],["#D4A840","Near goal"],["#D06060","Over goal"]].map(([col,lbl])=>`<div style="display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--ink-light);"><div style="width:8px;height:8px;border-radius:50%;background:${col};"></div>${lbl}</div>`).join("")}
        </div>
        <div style="font-size:10px;font-weight:800;color:#3A8060;">Goal: ${goal} kcal</div>
      </div>
    </div>

    <!-- Notes -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(144,200,168,.05);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">📝 Notes</div>

    </div>
  `;
  // focus search if adding
  if(addingMeal){setTimeout(()=>{document.getElementById("food-search")?.focus();},80);}
}

// Food log helpers
function getFoodLog(date){const log=foodLog();return log[date]||{meals:{},note:""};}
function setFoodLog(date,data){const log=foodLog();log[date]=data;saveFoodLog(log);}

function addFoodEntry(date,meal,name,cals,serving){
  const data=getFoodLog(date);
  if(!data.meals)data.meals={};
  if(!data.meals[meal])data.meals[meal]=[];
  data.meals[meal].push({name,cals:parseInt(cals)||0,serving:serving||""});
  setFoodLog(date,data);
  addingMeal=null;foodSearchQ="";
  renderFoodLog();
}
function addCustomFood(date,meal,name){
  const calEl=document.getElementById("custom-cals");
  const cals=parseInt(calEl?.value)||0;
  if(!name&&!cals){return;}
  addFoodEntry(date,meal,name||"Custom food",cals,"custom");
}
function removeFoodEntry(date,meal,idx){
  const data=getFoodLog(date);
  if(data.meals?.[meal]){data.meals[meal].splice(idx,1);}
  setFoodLog(date,data);
  renderFoodLog();
}
function saveFoodNote(date,note){
  const data=getFoodLog(date);
  data.note=note;
  setFoodLog(date,data);
}

    </div>

    <button onclick="saveHobbyProject('${p.id}','${isNew}')" style="width:100%;background:linear-gradient(135deg,#D8B8F0,#B898D8);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(160,120,200,.35);">💾 Save Project</button>
  `;
}

// ── Hobby helpers ──────────────────────────────────────────────────────────────
function saveHobbyProject(id,isNew){
  const all=isNew==="true"?hobbyProjects():hobbyProjects().filter(p=>p.id!==id);
  const existing=hobbyProjects().find(p=>p.id===id)||{steps:[],materials:[]};
  const proj={
    id,
    name:document.getElementById("hp-name")?.value?.trim()||"Untitled",
    emoji:document.getElementById("hp-emoji")?.value?.trim()||"🎨",
    description:document.getElementById("hp-desc")?.value||"",
    category:document.getElementById("hp-cat")?.value||"other",
    status:document.getElementById("hp-status")?.value||"active",
    steps:existing.steps||[],
    materials:existing.materials||[],
    photos:existing.photos||[],
    nextStep:document.getElementById("hp-next")?.value?.trim()||"",
    inspiration:document.getElementById("hp-inspo")?.value||"",
    notes:document.getElementById("hp-notes")?.value||"",
    progress:existing.progress||0,
    created:existing.created||Date.now(),
  };
  all.push(proj);
  saveHobbyProjects(all);
  curHobbyId=id;
  showToast("Project saved 🌸");
  renderHobbies();
}
function deleteHobbyProject(id){
  if(!confirm("Delete this project?"))return;
  saveHobbyProjects(hobbyProjects().filter(p=>p.id!==id));
  curHobbyId=null;renderHobbies();
}
function toggleHobbyStep(id,idx){
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  if(!p.steps)p.steps=[];
  p.steps[idx].done=!p.steps[idx].done;
  saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function addHobbyStep(id){
  const inp=document.getElementById("hp-step-in");
  const text=inp?.value?.trim();if(!text)return;
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  if(!p.steps)p.steps=[];
  p.steps.push({text,done:false});
  saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function deleteHobbyStep(id,idx){
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  p.steps.splice(idx,1);saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function toggleHobbyMaterial(id,idx){
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  if(!p.materials)p.materials=[];
  p.materials[idx].have=!p.materials[idx].have;
  saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function addHobbyMaterial(id){
  const inp=document.getElementById("hp-mat-in");
  const costInp=document.getElementById("hp-mat-cost");
  const text=inp?.value?.trim();if(!text)return;
  const cost=parseFloat(costInp?.value)||0;
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  if(!p.materials)p.materials=[];
  p.materials.push({text,have:false,cost:cost||""});
  saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function addHobbyPhoto(event,id,slot){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
    if(!p.photos)p.photos=[];
    p.photos[slot]=e.target.result;
    saveHobbyProjects(all);curHobbyId=id;renderHobbies();
  };
  reader.readAsDataURL(file);
}
function removeHobbyPhoto(id,slot){
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  if(p.photos)p.photos[slot]=null;
  saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}
function deleteHobbyMaterial(id,idx){
  const all=hobbyProjects();const p=all.find(p=>p.id===id);if(!p)return;
  p.materials.splice(idx,1);saveHobbyProjects(all);curHobbyId=id;renderHobbies();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
syncRecurringTasks(); // Run on startup to spawn today's recurring tasks
openJournal();
</script>

<!-- ── PWA SETUP ─────────────────────────────────────────────────────────────── -->
<script>
(function initPWA(){
  // ── 1. Generate app icon via canvas ─────────────────────────────────────────
  function makeIcon(size){
    const c=document.createElement("canvas");c.width=c.height=size;
    const ctx=c.getContext("2d");
    const g=ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0,"#F8D0D8");g.addColorStop(1,"#E8A0B8");
    ctx.fillStyle=g;
    const r=size*0.18;
    ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);
    ctx.quadraticCurveTo(size,0,size,r);ctx.lineTo(size,size-r);
    ctx.quadraticCurveTo(size,size,size-r,size);ctx.lineTo(r,size);
    ctx.quadraticCurveTo(0,size,0,size-r);ctx.lineTo(0,r);
    ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.fill();
    ctx.fillStyle="rgba(200,120,140,.55)";ctx.fillRect(0,0,size*0.12,size);
    ctx.font=`${size*0.52}px serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("🌸",size*0.58,size*0.48);
    ctx.font=`bold ${size*0.13}px Arial`;
    ctx.fillStyle="#8A4850";
    ctx.fillText("2026",size*0.58,size*0.82);
    return c.toDataURL("image/png");
  }

  const icon192=makeIcon(192);
  const icon512=makeIcon(512);
  const icon180=makeIcon(180);
  document.getElementById("appleIcon").href=icon180;

  // ── 2. Inject manifest ───────────────────────────────────────────────────────
  const manifest={
    name:"My 2026 Journal 🌸",
    short_name:"My Journal",
    description:"Personal 2026 journal — days, goals, habits, Bible reading and more.",
    start_url:".",
    display:"standalone",
    orientation:"portrait",
    theme_color:"#F0C8D0",
    background_color:"#FFF9F4",
    icons:[
      {src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
      {src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"},
    ]
  };
  try{
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    document.getElementById("manifestLink").href=URL.createObjectURL(blob);
  }catch(e){}

  // ── 3. Service Worker — HTTPS only (not file://) ─────────────────────────────
  // The journal works fully offline via localStorage already.
  // SW is only registered when served over HTTPS (e.g. from Netlify/GitHub Pages).
  if("serviceWorker" in navigator && location.protocol==="https:"){
    // Inline SW as a blob — safe on HTTPS
    const SW=`
const V="j26-v1";
self.addEventListener("install",e=>{self.skipWaiting();});
self.addEventListener("activate",e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==V).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener("fetch",e=>{
  if(e.request.method!=="GET")return;
  e.respondWith(
    caches.match(e.request).then(hit=>{
      const fresh=fetch(e.request).then(r=>{
        if(r&&r.status===200){const c=r.clone();caches.open(V).then(ch=>ch.put(e.request,c));}
        return r;
      }).catch(()=>hit);
      return hit||fresh;
    })
  );
});`;
    try{
      const swBlob=new Blob([SW],{type:"application/javascript"});
      const swURL=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).then(()=>{
        console.log("Journal SW registered ✅");
      }).catch(()=>{});
    }catch(e){}
  }

  // ── 4. Install prompt ────────────────────────────────────────────────────────
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    window._pwaPrompt=e;
    if(!localStorage.getItem("pwa_dismissed"))showInstallBanner();
  });

  function showInstallBanner(){
    if(document.getElementById("installBanner"))return;
    const style=document.createElement("style");
    style.textContent="@keyframes slideUpBanner{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}";
    document.head.appendChild(style);
    const banner=document.createElement("div");
    banner.id="installBanner";
    banner.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#F8D0D8,#F0C0D0);border-top:1.5px solid rgba(200,120,140,.3);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(180,100,120,.18);animation:slideUpBanner .4s ease;font-family:'Nunito',sans-serif;";
    banner.innerHTML=`
      <span style="font-size:28px;flex-shrink:0;">🌸</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:900;color:#8A4850;margin-bottom:1px;">Add to Home Screen</div>
        <div style="font-size:11px;font-weight:700;color:rgba(100,60,70,.7);">Install your journal for quick access!</div>
      </div>
      <button onclick="installPWA()" style="background:linear-gradient(135deg,#E8A0B8,#C07080);border:none;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;box-shadow:0 3px 10px rgba(180,80,110,.35);">Install ✨</button>
      <button onclick="dismissBanner()" style="background:none;border:none;color:rgba(100,60,70,.6);font-size:18px;cursor:pointer;flex-shrink:0;padding:0 4px;">✕</button>`;
    document.body.appendChild(banner);
  }

  window.installPWA=function(){
    if(window._pwaPrompt){
      window._pwaPrompt.prompt();
      window._pwaPrompt.userChoice.then(r=>{
        if(r.outcome==="accepted")document.getElementById("installBanner")?.remove();
      });
    }
  };
  window.dismissBanner=function(){
    document.getElementById("installBanner")?.remove();
    localStorage.setItem("pwa_dismissed","1");
  };

  // ── 5. iOS Add to Home Screen hint ──────────────────────────────────────────
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  if(isIOS&&!isStandalone&&!localStorage.getItem("pwa_dismissed")){
    setTimeout(()=>{
      const tip=document.createElement("div");
      tip.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#F8D0D8,#F0C0D0);border-top:1.5px solid rgba(200,120,140,.3);padding:12px 16px;box-shadow:0 -4px 20px rgba(180,100,120,.18);font-family:'Nunito',sans-serif;";
      tip.innerHTML=`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="font-size:22px;">🌸</span>
          <div style="font-size:13px;font-weight:900;color:#8A4850;">Add to Home Screen</div>
          <button onclick="this.closest('[style]').remove();localStorage.setItem('pwa_dismissed','1')" style="margin-left:auto;background:none;border:none;color:rgba(100,60,70,.6);font-size:18px;cursor:pointer;">✕</button>
        </div>
        <div style="font-size:12px;font-weight:700;color:rgba(100,60,70,.75);line-height:1.6;padding-left:32px;">
          Tap the <strong>Share</strong> button ⬆️ in Safari, then tap <strong>"Add to Home Screen"</strong> 🌸
        </div>`;
      document.body.appendChild(tip);
    },2000);
  }
})();
</script>
