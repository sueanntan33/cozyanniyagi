function renderBible(){
  document.getElementById("accentStrip").style.background="linear-gradient(90deg,#F0D8B0,#E8C890,#F0E0B0)";
  const bData=ldo("bible_data");
  const totalChaps=[...BIBLE_OT,...BIBLE_NT].reduce((s,b)=>s+b.c,0);
  const readChaps=Object.values(bData).reduce((s,v)=>s+Object.values(v).filter(Boolean).length,0);
  const pct=Math.round((readChaps/totalChaps)*100);
  function bookSection(books,label){
    return`<div class="bible-testament">
      <div class="bt-heading">${label}</div>
      <div class="bible-book-grid">
        ${books.map(b=>{
          const key=b.n.replace(/\s/g,"_");const brd=bData[key]||{};const rdCnt=Object.values(brd).filter(Boolean).length;const bpct=Math.round((rdCnt/b.c)*100);
          const isExp=bibleExpanded===key;
          return`<div class="bible-book-card" onclick="bibleExpanded=bibleExpanded==='${key}'?null:'${key}';renderBible()">
            <div class="bbc-top"><div class="bbc-name">${b.n}</div><div class="bbc-prog">${rdCnt}/${b.c}</div></div>
            <div class="bbc-bar-wrap"><div class="bbc-bar" style="width:${bpct}%"></div></div>
            ${isExp?`<div class="bbc-chapters">
              ${Array.from({length:b.c},(_,i)=>{const done=brd[i+1];return`<div class="bcc ${done?"rd":""}" onclick="event.stopPropagation();toggleBibleChap('${key}',${i+1})" title="Ch.${i+1}">${i+1}</div>`;}).join("")}
            </div>`:""}
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }
  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">Bible Reading Tracker</div>
    <div class="section-sub">📖 Track every chapter you read</div>
    <div class="divider"></div>
    <div class="bible-stats">
      <div class="bs-card"><div class="bs-val">${readChaps}</div><div class="bs-lbl">Chapters Read</div></div>
      <div class="bs-card"><div class="bs-val">${pct}%</div><div class="bs-lbl">Bible Complete</div></div>
      <div class="bs-card"><div class="bs-val">${totalChaps-readChaps}</div><div class="bs-lbl">Remaining</div></div>
    </div>
    <div style="background:var(--gold-pale);border:1.5px solid rgba(200,168,72,.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#8A6820;margin-bottom:5px;"><span>Overall Progress</span><span>${pct}%</span></div>
      <div style="height:8px;background:rgba(200,168,72,.2);border-radius:4px;overflow:hidden;"><div style="height:100%;border-radius:4px;background:linear-gradient(90deg,#D4A828,#F0C850);width:${pct}%;transition:width .6s ease;"></div></div>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--ink-light);margin-bottom:12px;text-align:center;">Tap a book to expand chapters · tap a chapter to mark as read</div>
    ${bookSection(BIBLE_OT,"📜 Old Testament")}
    ${bookSection(BIBLE_NT,"✝️ New Testament")}
  `;
}
function toggleBibleChap(bookKey,chap){const bData=ldo("bible_data");if(!bData[bookKey])bData[bookKey]={};bData[bookKey][chap]=!bData[bookKey][chap];svo("bible_data",bData);renderBible();}

// ═══════════════════════════════════════════════════════════════════════════════
// ── INVENTORY TRACKER ─────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function renderInventory(){
  document.getElementById("accentStrip").style.background="linear-gradient(90deg,#C8D8E8,#B8C8D8,#C8D0E8)";
  const items=lda("inventory");
  const filtered=invFilter==="All"?items:items.filter(i=>i.cat===invFilter);
  const lowStock=items.filter(i=>i.qty<=i.min);
  const CAT_COLORS={Food:"#A8D8B0",Household:"#A8C8D8",Personal:"#D8A8C0","Personal Care":"#D8A8C0",Office:"#B8A8D8",Clothing:"#D8C0A8",Electronics:"#A8B8D8",Medical:"#D8B0B0",Other:"#C8C8A8"};
  // ── Inventory stats
  const totalItems=items.length;
  const totalQty=items.reduce((s,i)=>s+i.qty,0);
  const lowStockCount=lowStock.length;
  const outOfStock=items.filter(i=>i.qty===0).length;
  const catBreakdown={};items.forEach(i=>{catBreakdown[i.cat]=(catBreakdown[i.cat]||0)+1;});
  const topInvCat=Object.entries(catBreakdown).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">Inventory Tracker</div>
    <div class="section-sub">📦 Keep track of what you have</div>
    <div class="divider"></div>

    <!-- STATS BOXES -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;">
      <div style="background:white;border-radius:14px;padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1.5px solid #C8D8EC;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:#4878A8;">${totalItems}</div>
        <div style="font-size:9px;font-weight:900;color:var(--ink-light);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;">📦 Total Items</div>
      </div>
      <div style="background:white;border-radius:14px;padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1.5px solid #C8D8EC;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:#4878A8;">${totalQty}</div>
        <div style="font-size:9px;font-weight:900;color:var(--ink-light);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;">🔢 Total Units</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;">
      <div style="background:${lowStockCount?"#FFF0F0":"#EDFFF5"};border-radius:14px;padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1.5px solid ${lowStockCount?"#F0C8C8":"#A8DCC0"};">
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:${lowStockCount?"#C07878":"#3A8860"};">${lowStockCount}</div>
        <div style="font-size:9px;font-weight:900;color:${lowStockCount?"#C07878":"var(--ink-light)"};text-transform:uppercase;letter-spacing:.08em;margin-top:2px;">⚠️ Low Stock</div>
      </div>
      <div style="background:${outOfStock?"#FFF0F0":"white"};border-radius:14px;padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1.5px solid ${outOfStock?"#F0C8C8":"#C8D8EC"};">
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:${outOfStock?"#C07878":"#4878A8"};">${outOfStock}</div>
        <div style="font-size:9px;font-weight:900;color:${outOfStock?"#C07878":"var(--ink-light)"};text-transform:uppercase;letter-spacing:.08em;margin-top:2px;">🚫 Out of Stock</div>
      </div>
    </div>
    ${topInvCat?`<div style="background:white;border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1.5px solid #C8D8EC;display:flex;align-items:center;gap:10px;">
      <div style="font-size:11px;font-weight:700;color:var(--ink-light);">Top category:</div>
      <div style="font-size:13px;font-weight:900;color:#4878A8;flex:1;">${topInvCat[0]}</div>
      <div style="font-size:11px;font-weight:800;color:var(--ink-light);">${topInvCat[1]} item${topInvCat[1]!==1?"s":""}</div>
    </div>`:""}

    ${lowStockCount?`<div style="background:#FFF0F0;border:1.5px solid #F0C8C8;border-radius:12px;padding:10px 14px;margin-bottom:12px;"><div style="font-size:11px;font-weight:900;color:#C07878;margin-bottom:6px;">⚠️ Low Stock Alert</div>${lowStock.map(i=>`<span style="background:white;border:1px solid #F0C8C8;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;color:#C07878;margin:2px;display:inline-block;">${i.name} (${i.qty})</span>`).join("")}</div>`:""}
    <div class="inv-add-row">
      <input class="inv-input" id="invName" placeholder="Item name..." maxlength="40"/>
      <input class="inv-input sm" id="invQty" type="number" value="1" min="0" placeholder="Qty"/>
      <input class="inv-input sm" id="invMin" type="number" value="1" min="0" placeholder="Min"/>
      <select class="inv-input" id="invCat" style="max-width:110px">${INV_CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select>
      <button class="inv-add-btn" onclick="addInventoryItem()">+ Add</button>
    </div>
    <div class="inv-cat-filter">
      ${INV_CATS.map(c=>`<button class="icf-btn ${invFilter===c?"on":""}" onclick="invFilter='${c}';renderInventory()">${c}</button>`).join("")}
    </div>
    ${filtered.length===0?`<div style="text-align:center;padding:24px;color:var(--ink-light);font-size:13px;font-weight:700;">📦 No items yet. Add one above!</div>`:`
    <table class="inv-table"><thead><tr><th>Item</th><th>Category</th><th>Quantity</th><th>Min</th><th></th></tr></thead><tbody>
      ${filtered.map(item=>{
        const cc=CAT_COLORS[item.cat]||"#C8C8A8";const isLow=item.qty<=item.min;
        return`<tr>
          <td style="font-weight:800;color:var(--ink)">${item.name}${isLow?` <span class="inv-low">Low</span>`:""}</td>
          <td><span class="inv-cat-tag" style="background:${cc}33;color:${cc.replace("A","6").replace("8","5")}">${item.cat}</span></td>
          <td><div class="inv-qty-wrap">
            <button class="inv-qty-btn" onclick="adjInv('${item.id}',-1)">−</button>
            <span class="inv-qty">${item.qty}</span>
            <button class="inv-qty-btn" onclick="adjInv('${item.id}',1)">+</button>
          </div></td>
          <td style="font-size:11px;color:var(--ink-light)">${item.min}</td>
          <td><button class="inv-del" onclick="delInv('${item.id}')">✕</button></td>
        </tr>`;
      }).join("")}
    </tbody></table>`}
  `;
}
function addInventoryItem(){
  const name=document.getElementById("invName")?.value?.trim();if(!name)return;
  const qty=parseInt(document.getElementById("invQty")?.value)||1;
  const min=parseInt(document.getElementById("invMin")?.value)||1;
  const cat=document.getElementById("invCat")?.value||"Other";
  const items=lda("inventory");
  items.push({id:Date.now().toString(),name,qty,min,cat,notes:""});
  sva("inventory",items);renderInventory();
}
function adjInv(id,delta){const items=lda("inventory");const i=items.find(i=>i.id===id);if(i){i.qty=Math.max(0,i.qty+delta);}sva("inventory",items);renderInventory();}
function delInv(id){sva("inventory",lda("inventory").filter(i=>i.id!==id));renderInventory();}

// ═══════════════════════════════════════════════════════════════════════════════
// ── MEDICINE TRACKER ──────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function renderMedicine(){
  document.getElementById("accentStrip").style.background="linear-gradient(90deg,#D8C8E8,#C8B8D8,#D0C0E0)";
  const meds=lda("medicines");

  function medCard(med){
    const isEditing=window.editingMedId===med.id;
    if(isEditing){
      return`<div class="med-card" style="border-color:#B4A8D8;background:#F8F4FF;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--lavender);margin-bottom:9px;">✏️ Editing</div>
        <input id="edit-med-name" value="${med.name.replace(/"/g,'&quot;')}" style="width:100%;border:1.5px solid #B4A8D8;border-radius:9px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--ink);background:white;outline:none;margin-bottom:7px;"/>
        <input id="edit-med-dose" value="${(med.dose||'').replace(/"/g,'&quot;')}" placeholder="Dosage (e.g. 10mg)" style="width:100%;border:1.5px solid #EEE0EC;border-radius:9px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:white;outline:none;margin-bottom:7px;"/>
        <input id="edit-med-freq" value="${(med.freq||'').replace(/"/g,'&quot;')}" placeholder="Frequency (e.g. Once daily, Twice daily)" style="width:100%;border:1.5px solid #EEE0EC;border-radius:9px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:white;outline:none;margin-bottom:7px;"/>
        <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">Times</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          ${MED_TIMES.map(t=>`<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-mid);cursor:pointer;"><input type="checkbox" value="${t}" ${(med.times||[]).includes(t)?"checked":""} style="accent-color:#B4A8D8;width:14px;height:14px;"> ${t}</label>`).join("")}
        </div>
        <input id="edit-med-notes" value="${(med.notes||'').replace(/"/g,'&quot;')}" placeholder="Notes (purpose, instructions...)" style="width:100%;border:1.5px solid #EEE0EC;border-radius:9px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);background:white;outline:none;margin-bottom:10px;"/>
        <div style="display:flex;gap:8px;">
          <button onclick="saveMedEdit('${med.id}')" style="flex:2;background:linear-gradient(135deg,#C8B8E8,#A898D0);border:none;border-radius:10px;padding:9px;font-size:12px;font-weight:900;color:white;cursor:pointer;font-family:'Nunito',sans-serif;">✓ Save</button>
          <button onclick="window.editingMedId=null;renderMedicine()" style="flex:1;background:white;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px;font-size:12px;font-weight:800;color:var(--ink-light);cursor:pointer;font-family:'Nunito',sans-serif;">Cancel</button>
        </div>
      </div>`;
    }
    const times=(med.times||["Morning"]);
    return`<div class="med-card">
      <div class="med-card-top">
        <div class="med-icon">💊</div>
        <div style="flex:1;min-width:0;">
          <div class="med-name">${med.name}</div>
          ${med.dose?`<div class="med-dose">${med.dose}</div>`:""}
          ${med.freq?`<div style="font-size:10px;font-weight:700;color:var(--ink-light);margin-top:1px;">🔄 ${med.freq}</div>`:""}
          <div class="med-dose">${times.join(" · ")}</div>
          ${med.notes?`<div style="font-size:11px;font-weight:600;color:var(--ink-light);margin-top:3px;line-height:1.4;">📝 ${med.notes}</div>`:""}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button onclick="window.editingMedId='${med.id}';renderMedicine()" style="width:28px;height:28px;border-radius:50%;background:var(--blush);border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">✏️</button>
          <button class="med-del-btn" onclick="delMed('${med.id}')">✕</button>
        </div>
      </div>
      <div class="med-times">
        ${times.map(t=>{
          const key=`${med.id}_${t}`;
          const taken=ldo(`med_today`)[key];
          return`<div class="med-time-chk ${taken?"taken":""}" onclick="toggleMedTakenToday('${med.id}','${t}')">${taken?"✓":""} ${t}</div>`;
        }).join("")}
      </div>
    </div>`;
  }

  const todayTaken=ldo("med_today");
  const allTaken=meds.length>0&&meds.every(m=>(m.times||["Morning"]).every(t=>todayTaken[`${m.id}_${t}`]));

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">💊 My Medications</div>
    <div class="section-sub">Master medication list · tap to log today's doses</div>
    <div class="divider"></div>

    ${allTaken&&meds.length?`<div style="background:#EDFFF5;border:1.5px solid #90C8A8;border-radius:12px;padding:10px;text-align:center;margin-bottom:12px;font-size:13px;font-weight:800;color:#3A8860;">✅ All medications taken today!</div>`:""}

    <!-- Add new medication -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-light);margin-bottom:10px;">✦ Add Medication</div>
      <input id="medName" class="med-input" placeholder="Medication name..." maxlength="60" style="margin-bottom:7px;"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;">
        <input id="medDose" class="med-input" placeholder="Dosage (e.g. 10mg)"/>
        <input id="medFreq" class="med-input" placeholder="Frequency (e.g. Once daily)"/>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;" id="medTimeSel">
        ${MED_TIMES.map(t=>`<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-mid);cursor:pointer;"><input type="checkbox" value="${t}" style="accent-color:#B4A8D8;width:14px;height:14px;"> ${t}</label>`).join("")}
      </div>
      <input id="medNotes" class="med-input" placeholder="Notes (purpose, doctor instructions...)" style="margin-bottom:9px;"/>
      <button class="med-add-btn" style="width:100%;" onclick="addMed()">+ Add Medication</button>
    </div>

    ${meds.length===0
      ?`<div style="text-align:center;padding:32px;color:var(--ink-light);font-size:13px;font-weight:700;">💊 No medications yet. Add one above!</div>`
      :meds.map(m=>medCard(m)).join("")}
  `;
}

function addMed(){
  const name=document.getElementById("medName")?.value?.trim();if(!name)return;
  const dose=document.getElementById("medDose")?.value?.trim()||"";
  const freq=document.getElementById("medFreq")?.value?.trim()||"";
  const notes=document.getElementById("medNotes")?.value?.trim()||"";
  const checks=document.querySelectorAll("#medTimeSel input:checked");
  const times=checks.length?[...checks].map(c=>c.value):["Morning"];
  const meds=lda("medicines");
  meds.push({id:Date.now().toString(),name,dose,freq,notes,times});
  sva("medicines",meds);
  window.editingMedId=null;
  renderMedicine();
}
function delMed(id){
  if(!confirm("Remove this medication?"))return;
  sva("medicines",lda("medicines").filter(m=>m.id!==id));
  renderMedicine();
}
function saveMedEdit(id){
  const meds=lda("medicines");const m=meds.find(m=>m.id===id);if(!m)return;
  m.name=document.getElementById("edit-med-name")?.value?.trim()||m.name;
  m.dose=document.getElementById("edit-med-dose")?.value?.trim()||"";
  m.freq=document.getElementById("edit-med-freq")?.value?.trim()||"";
  m.notes=document.getElementById("edit-med-notes")?.value?.trim()||"";
  const checks=document.querySelectorAll("#medTimeSel input:checked");
  // fall back to existing times if no checkboxes found (edit mode uses different IDs)
  const editChecks=document.querySelectorAll(".med-card input[type=checkbox]:checked");
  if(editChecks.length)m.times=[...editChecks].map(c=>c.value);
  sva("medicines",meds);
  window.editingMedId=null;
  renderMedicine();
}
function toggleMedTakenToday(medId,time){
  const data=ldo("med_today");
  const key=`${medId}_${time}`;
  data[key]=!data[key];
  svo("med_today",data);
  renderMedicine();
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── BLOOD PRESSURE TRACKER ────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function bpStatus(sys,dia){
  if(sys<120&&dia<80)return{label:"Normal",cls:"normal"};
  if(sys<130&&dia<80)return{label:"Elevated",cls:"elevated"};
  if(sys<140||dia<90)return{label:"High S1",cls:"high"};
  return{label:"High S2",cls:"high"};
}
function renderBP(){
  document.getElementById("accentStrip").style.background="linear-gradient(90deg,#F0C8C8,#E8B8B8,#F0C0C8)";
  const records=lda("bp_records").slice(0,30);
  const avgSys=records.length?Math.round(records.slice(0,7).reduce((s,r)=>s+r.sys,0)/Math.min(records.length,7)):0;
  const avgDia=records.length?Math.round(records.slice(0,7).reduce((s,r)=>s+r.dia,0)/Math.min(records.length,7)):0;
  const avgPul=records.length?Math.round(records.slice(0,7).reduce((s,r)=>s+r.pulse,0)/Math.min(records.length,7)):0;

  // Mini SVG chart
  let chartSvg="";
  if(records.length>=2){
    const pts=records.slice(0,14).reverse();const n=pts.length;
    const w=460,h=90,pad=20;
    const allSys=pts.map(r=>r.sys),allDia=pts.map(r=>r.dia);
    const minV=Math.min(...allDia)-10,maxV=Math.max(...allSys)+10;
    const px=(i)=>pad+(i/(n-1))*(w-pad*2);
    const py=(v)=>h-pad-((v-minV)/(maxV-minV))*(h-pad*2);
    const sysLine=pts.map((r,i)=>`${i===0?"M":"L"}${px(i)},${py(r.sys)}`).join(" ");
    const diaLine=pts.map((r,i)=>`${i===0?"M":"L"}${px(i)},${py(r.dia)}`).join(" ");
    chartSvg=`<svg class="bp-chart-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad}" y1="${py(120)}" x2="${w-pad}" y2="${py(120)}" stroke="#C8E8D0" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="${pad}" y1="${py(80)}"  x2="${w-pad}" y2="${py(80)}"  stroke="#E8C8C8" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="${sysLine}" stroke="#E8888A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${diaLine}" stroke="#88A8D8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((r,i)=>`<circle cx="${px(i)}" cy="${py(r.sys)}" r="3.5" fill="#E8888A"/><circle cx="${px(i)}" cy="${py(r.dia)}" r="3.5" fill="#88A8D8"/>`).join("")}
    </svg>`;
  }

  const selArm=window._bpArm||"Left";
  const selTime=window._bpTime||"Morning";
  const armBtns=[{v:"Left",l:"💪 Left"},{v:"Right",l:"💪 Right"}];
  const timeBtns=[{v:"Morning",l:"🌅 Morning"},{v:"Afternoon",l:"☀️ Afternoon"},{v:"Night",l:"🌙 Night"}];
  const armStyle=(v)=>v===selArm?"background:#FFF0F4;border-color:#F0C0C8;color:#C07880;font-weight:900":"background:white;color:var(--ink-mid)";
  const timeStyle=(v)=>v===selTime?"background:#FFF8EE;border-color:#F0D8A0;color:#A07020;font-weight:900":"background:white;color:var(--ink-mid)";

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">Blood Pressure</div>
    <div class="section-sub">❤️ Track your readings over time</div>
    <div class="divider"></div>
    <div class="bp-add-card">
      <div class="bp-add-title">📝 Log New Reading</div>
      <div class="bp-inputs">
        <div class="bp-field"><div class="bp-field-lbl">Systolic</div><input class="bp-input" id="bpSys" type="number" placeholder="120" min="50" max="250"/></div>
        <div class="bp-field"><div class="bp-field-lbl">Diastolic</div><input class="bp-input" id="bpDia" type="number" placeholder="80" min="30" max="150"/></div>
        <div class="bp-field"><div class="bp-field-lbl">Pulse</div><input class="bp-input" id="bpPulse" type="number" placeholder="72" min="30" max="200"/></div>
        <div class="bp-field"><div class="bp-field-lbl">Date</div><input class="bp-input" id="bpDate" type="date" value="${tds()}" style="font-size:11px;padding:6px 4px;"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">💪 Arm</div>
          <div style="display:flex;gap:6px;">
            ${armBtns.map(b=>`<button onclick="window._bpArm='${b.v}';renderBP()" style="flex:1;border:1.5px solid #EDE0D8;border-radius:10px;padding:8px 4px;font-family:'Nunito',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;${armStyle(b.v)}">${b.l}</button>`).join("")}
          </div>
        </div>
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:6px;">🕐 Time of Day</div>
          <div style="display:flex;gap:5px;">
            ${timeBtns.map(b=>`<button onclick="window._bpTime='${b.v}';renderBP()" style="flex:1;border:1.5px solid #EDE0D8;border-radius:10px;padding:8px 2px;font-family:'Nunito',sans-serif;font-size:10px;cursor:pointer;transition:all .15s;${timeStyle(b.v)}">${b.l}</button>`).join("")}
          </div>
        </div>
      </div>
      <input class="bp-input" id="bpNote" placeholder="Notes (optional)..." style="width:100%;margin-bottom:10px;text-align:left;font-size:12px;"/>
      <button class="bp-save-btn" onclick="addBPRecord()">+ Save Reading</button>
    </div>
    ${records.length>=2?`

      }).join("")}

}
function addBPRecord(){
  const sys=parseInt(document.getElementById("bpSys")?.value);
  const dia=parseInt(document.getElementById("bpDia")?.value);
  const pulse=parseInt(document.getElementById("bpPulse")?.value)||0;
  const date=document.getElementById("bpDate")?.value||tds();
  const note=document.getElementById("bpNote")?.value?.trim();
  if(!sys||!dia){alert("Please enter systolic and diastolic values.");return;}
  const arm=window._bpArm||"Left";
  const timeOfDay=window._bpTime||"Morning";
  const records=lda("bp_records");
  records.unshift({id:Date.now().toString(),sys,dia,pulse,date,note,arm,timeOfDay});
  sva("bp_records",records);renderBP();
}
function delBP(id){sva("bp_records",lda("bp_records").filter(r=>r.id!==id));renderBP();}

const PAGE_COLORS=[
  {name:"Rose",    top:"#F0A8B8", bg:"#FFF5F8", border:"#EDD0D8"},
  {name:"Lavender",top:"#C0AEE0", bg:"#F8F5FF", border:"#D8D0F0"},
  {name:"Mint",    top:"#88C8A8", bg:"#F0FFF8", border:"#C0E8D0"},

  {name:"Sage",    top:"#A0B898", bg:"#F4F8F2", border:"#C8D8C0"},
];

function getPages(){return lda("journal_pages");}
function savePages(pages){sva("journal_pages",pages);}

function renderPages(){
  curPageId=null;
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.pages;
  const pages=getPages();

  const actionBtns=`
    <button class="new-page-btn" onclick="addNewPage()" style="margin-bottom:8px;">✦ New Blank Page</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      <button onclick="showSection('monthly_reset')" style="border:1.5px solid #D0C8E8;border-radius:14px;padding:12px 8px;background:linear-gradient(135deg,#F8F5FF,#EEE8FF);font-size:12px;font-weight:800;color:#7060A0;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;text-align:center;line-height:1.4;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">
        <div style="font-size:22px;margin-bottom:4px;">🌙</div>Monthly Reset

        <div style="font-size:22px;margin-bottom:4px;">🌱</div>Weekly Reset
      </button>
    </div>`;

  if(pages.length===0){
    document.getElementById("pageInner").innerHTML=`
      <div class="section-heading">My Pages</div>
      <div class="section-sub">📓 Write, reflect & reset</div>
      <div class="divider"></div>
      ${actionBtns}
      <div class="pages-empty">
        <span>📓</span>
        No blank pages yet.<br>Tap above to start writing!
      </div>`;
    return;
  }

  const grid=pages.map((p)=>{
    const col=PAGE_COLORS[p.colorIdx||0];

    return`<div class="page-thumb" style="border-color:${col.border};background:${col.bg};" onclick="openPage('${p.id}')">
      <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${col.top};border-radius:4px 4px 0 0;"></div>
      <button class="page-thumb-del" onclick="event.stopPropagation();deletePage('${p.id}')">✕</button>
      <div class="page-thumb-title">${p.title||"Untitled"}</div>
      <div class="page-thumb-preview">${preview}</div>
      <div class="page-thumb-meta">${p.date}${p.tag?` · ${p.tag}`:""}</div>
    </div>`;
  }).join("");

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">My Pages</div>
    <div class="section-sub">📓 ${pages.length} page${pages.length!==1?"s":""}</div>
    <div class="divider"></div>
    ${actionBtns}
    <div class="pages-index">${grid}</div>
  `;
}

function addNewPage(){
  const pages=getPages();
  const id=Date.now().toString();
  const newPage={
    id,
    title:"",
    content:"",
    date:tds(),
    tag:"",
    colorIdx:pages.length%PAGE_COLORS.length,
  };
  pages.unshift(newPage);
  savePages(pages);
  openPage(id);
}

function openPage(id){
  curPageId=id;
  const pages=getPages();
  const p=pages.find(p=>p.id===id);
  if(!p)return;
  const col=PAGE_COLORS[p.colorIdx||0];

  const colorDots=PAGE_COLORS.map((c,i)=>
    `<div class="lp-color-dot ${p.colorIdx===i?"sel":""}" style="background:${c.top}" onclick="setPageColor('${id}',${i})" title="${c.name}"></div>`
  ).join("");

  document.getElementById("accentStrip").style.background=`linear-gradient(90deg,${col.top},${col.border},transparent)`;
  document.getElementById("pageInner").innerHTML=`
    <button class="lp-back-btn" onclick="renderPages()">◀ All Pages</button>

    <div class="lined-page">
      <div class="lp-header" style="background:${col.bg};border-bottom-color:${col.border}">
        <input class="lp-title-input" placeholder="Page Title..." value="${(p.title||"").replace(/"/g,"&quot;")}"
          onchange="updatePage('${id}','title',this.value)"
          style="color:${col.top};caret-color:${col.top};"/>
        <div class="lp-meta-row">
          <span class="lp-date">${new Date(p.date+"T12:00:00").toLocaleDateString("en",{weekday:"short",month:"long",day:"numeric",year:"numeric"})}</span>
          <input class="lp-tag-input" placeholder="tag..." value="${p.tag||""}"
            onchange="updatePage('${id}','tag',this.value)"
            style="border-color:${col.border};"/>
          <div class="lp-color-dots">${colorDots}</div>
        </div>
      </div>
      <div class="lp-body">
        <textarea class="lp-textarea" id="lpText" placeholder="Write freely on these lined pages...

Your thoughts, prayers, ideas, reflections — this is your space. 🌸"
          onchange="updatePage('${id}','content',this.value)"
          onfocus="autoGrow(this)"
          oninput="autoGrow(this)">${(p.content||"").replace(/</g,"&lt;")}</textarea>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <button onclick="duplicatePage('${id}')" style="flex:1;border:1.5px solid ${col.border};border-radius:10px;padding:8px;background:${col.bg};font-size:11px;font-weight:800;color:${col.top};cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;">⊕ Duplicate</button>
      <button onclick="deletePage('${id}')" style="flex:1;border:1.5px solid #EDE0D8;border-radius:10px;padding:8px;background:white;font-size:11px;font-weight:800;color:var(--ink-light);cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;">✕ Delete Page</button>
    </div>
  `;

  // Auto-grow textarea to fit content
  setTimeout(()=>{
    const ta=document.getElementById("lpText");
    if(ta)autoGrow(ta);
  },50);
}

function autoGrow(el){
  el.style.height="auto";
  el.style.height=Math.max(420,el.scrollHeight)+"px";
}

function updatePage(id,field,value){
  const pages=getPages();
  const p=pages.find(p=>p.id===id);
  if(!p)return;
  p[field]=value;
  savePages(pages);
}

function setPageColor(id,colorIdx){
  updatePage(id,"colorIdx",colorIdx);
  openPage(id);
}

function deletePage(id){
  if(!confirm("Delete this page? This cannot be undone."))return;
  savePages(getPages().filter(p=>p.id!==id));
  renderPages();
}

function duplicatePage(id){
  const pages=getPages();
  const p=pages.find(p=>p.id===id);
  if(!p)return;
  const copy={...p,id:Date.now().toString(),title:(p.title||"Untitled")+" (copy)",date:tds()};
  pages.unshift(copy);
  savePages(pages);
  openPage(copy.id);
}

function renderWeeklyReset(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.weekly_reset;
  const nowDOY=todayDOY();const nowWk=weekNum(nowDOY);
  const fmt=d=>d.toLocaleDateString("en",{month:"short",day:"numeric"});

  // Build all 52 weeks of 2026
  let pills="";
  for(let w=1;w<=52;w++){
    const sd=weekStart(w);if(sd>365)break;
    const ed=Math.min(sd+6,365);
    const a=dateFromDOY(sd),b=dateFromDOY(ed);
    const wk=`wr_2026_${w}`;const d=ldo(wk);
    const started=Object.keys(d).length>0;
    const isCur=w===nowWk;
    pills+=`<div class="week-pill-card ${started?"started":""}" style="${isCur?"border-color:#508060;background:#EDFFF5;":""}" onclick="openWeeklyResetPage(${w})">
      <div class="wpc-num" style="color:${isCur?"#407050":"var(--ink)"}">${w}</div>
      <div class="wpc-dates">${fmt(a)}<br>${fmt(b)}</div>
      ${isCur?`<div class="wpc-dot" style="background:#508060;"></div>`:""}
      ${started&&!isCur?`<div class="wpc-dot"></div>`:""}
    </div>`;
  }

  document.getElementById("pageInner").innerHTML=`
    <div class="section-heading">🌱 Weekly Reset</div>
    <div class="section-sub">Reflect & renew — all 52 weeks · 2026</div>
    <div class="divider"></div>
    <div class="week-pill-grid">${pills}</div>
  `;
}

    const on=stored===n;const col=n<=3?"#F0A8A8":n<=6?"#F0D090":"#A8D8A8";

      </div>
      <div class="reset-section">

    </div>
  `;
}

function saveMR(key,field,value){const d=ldo(key);d[field]=value;svo(key,d);}
function saveWR(key,field,value){const d=ldo(key);d[field]=value;svo(key,d);}

// ── HOUSE PROJECTS ────────────────────────────────────────────────────────────

let houseGanttView=3; // months: 3, 6, or 12

function houseProjects(){return lda("house_projects");}
function saveHouseProjects(arr){sva("house_projects",arr);}
function houseUID(){return "hp"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

function renderHouse(){
  document.getElementById("accentStrip").style.background="linear-gradient(90deg,#F0C8D0,#D8C8E8,#C8D8E8)";
  const projects=houseProjects();
  const total=projects.length;
  const inProgress=projects.filter(p=>p.status==="In Progress").length;
  const completed=projects.filter(p=>p.status==="Completed").length;
  const planning=projects.filter(p=>p.status==="Planning").length;
  const avgProg=total?Math.round(projects.reduce((s,p)=>s+(p.progress||0),0)/total):0;

  // Status colours mapped to journal palette
  const STATUS_COL={
    "Planning":    {bar:"#B4A8D8",bg:"rgba(180,168,216,.15)",text:"#6858A8"},
    "In Progress": {bar:"#E8A0B8",bg:"rgba(232,160,184,.15)",text:"#C06880"},
    "Completed":   {bar:"#94C8A8",bg:"rgba(148,200,168,.15)",text:"#3A7858"},
    "On Hold":     {bar:"#F0C090",bg:"rgba(240,192,144,.15)",text:"#A07030"},
    "Paused":      {bar:"#9C8C84",bg:"rgba(156,140,132,.15)",text:"#6C5C54"},
  };
  const sc=id=>STATUS_COL[id]||STATUS_COL["Planning"];

  // ── Gantt ────────────────────────────────────────────────────────────────────
  function renderGantt(){
    if(!projects.length) return `<div style="text-align:center;padding:36px 20px;"><span style="font-size:40px;display:block;margin-bottom:12px;">🏠</span><div style="font-family:'Dancing Script',cursive;font-size:18px;color:var(--ink-light);">No projects yet</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:4px;">Add your first project above 🌸</div></div>`;
    const today=new Date();
    const viewMonths=houseGanttView;
    const cols=[];
    for(let i=0;i<viewMonths;i++){
      const d=new Date(today.getFullYear(),today.getMonth()+i,1);
      cols.push({label:d.toLocaleDateString("en",{month:"short"})+" '"+String(d.getFullYear()).slice(2)});
    }
    const totalDays=viewMonths*30;
    const startRef=new Date(today.getFullYear(),today.getMonth(),1);
    const colHeaders=cols.map(c=>`<div style="flex:1;text-align:center;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);padding:5px 2px;border-right:1px solid #EDE5DD;">${c.label}</div>`).join("");
    const rows=projects.map(p=>{
      const ps=p.start?new Date(p.start):today;
      const pe=p.end?new Date(p.end):new Date(ps.getTime()+30*864e5);
      const offsetPct=Math.min(100,Math.max(0,(ps-startRef)/(864e5)/totalDays*100));
      const widthPct=Math.min(100-offsetPct,Math.max(2,(pe-ps)/(864e5)/totalDays*100));
      const bar=sc(p.status).bar;
      return`<div style="display:flex;align-items:center;border-bottom:1px solid #F0E8EC;min-height:34px;">
        <div style="width:86px;flex-shrink:0;font-size:10px;font-weight:800;color:var(--ink-mid);padding:4px 8px;border-right:1px solid #EDE5DD;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${p.name}">${p.name}</div>
        <div style="flex:1;position:relative;height:34px;">
          ${cols.map((_,i)=>`<div style="position:absolute;left:${i/viewMonths*100}%;width:${1/viewMonths*100}%;top:0;bottom:0;border-right:1px solid #F8F0F4;"></div>`).join("")}
          <div style="position:absolute;left:${offsetPct}%;width:${widthPct}%;top:50%;transform:translateY(-50%);height:16px;background:${bar};border-radius:8px;display:flex;align-items:center;justify-content:center;min-width:16px;box-shadow:0 2px 6px rgba(0,0,0,.12);">
            ${widthPct>10?`<span style="font-size:8px;font-weight:900;color:white;padding:0 5px;">${p.progress||0}%</span>`:""}
          </div>
        </div>
      </div>`;
    }).join("");
    return`<div style="overflow-x:auto;"><div style="min-width:280px;">
      <div style="display:flex;border-bottom:1.5px solid #EDE5DD;">
        <div style="width:86px;flex-shrink:0;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);padding:5px 8px;border-right:1px solid #EDE5DD;">PROJECT</div>
        <div style="flex:1;display:flex;">${colHeaders}</div>
      </div>
      ${rows}
    </div></div>`;
  }

  const statuses=["Planning","In Progress","Completed","On Hold","Paused"];
  const today=new Date().toISOString().split("T")[0];

  document.getElementById("pageInner").innerHTML=`
    <!-- Page heading -->
    <div style="margin-bottom:14px;">
      <div class="section-heading" style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--rose-deep);">🏠 House Projects</div>
      <div class="section-sub" style="font-size:11px;font-weight:700;color:var(--ink-light);margin-top:2px;">Gantt chart planner · auto-saved</div>
    </div>

    <!-- Stats 2×2 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;">
      ${[
        {label:"Total Projects", val:total,       color:"var(--rose-dark)"},
        {label:"In Progress",    val:inProgress,   color:"var(--lavender)"},
        {label:"Completed",      val:completed,    color:"var(--mint)"},
        {label:"Planning",       val:planning,     color:"var(--gold)"},
      ].map(s=>`
        <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:14px 14px 10px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
          <div style="font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:${s.color};line-height:1;">${s.val}</div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-top:6px;">${s.label}</div>
        </div>`).join("")}
    </div>

    <!-- Avg progress full-width card -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:13px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);">📊 Average Progress</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--rose-dark);">${avgProg}%</div>
      </div>
      <div style="height:9px;background:#F0E8EC;border-radius:5px;overflow:hidden;">
        <div style="height:100%;width:${avgProg}%;background:linear-gradient(90deg,var(--rose),var(--lavender));border-radius:5px;transition:width .5s;"></div>
      </div>
    </div>

    <!-- Add project form -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-light);margin-bottom:11px;">✦ Add New Project</div>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;">
        <span style="font-size:22px;flex-shrink:0;">🏠</span>
        <input id="hp-name" style="flex:1;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);outline:none;background:#FAFAFA;transition:border-color .2s;" placeholder="Project name... (e.g. Kitchen Reno)" onfocus="this.style.borderColor='var(--rose)'" onblur="this.style.borderColor='#EEE0EC'"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;">
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">📅 Start Date</div>
          <input id="hp-start" type="date" value="${today}" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        </div>
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">🏁 End Date</div>
          <input id="hp-end" type="date" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">Status</div>
        <select id="hp-status" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;cursor:pointer;">
          ${statuses.map(s=>`<option value="${s}">${s}</option>`).join("")}
        </select>
      </div>
      <button onclick="addHouseProject()" style="width:100%;background:linear-gradient(135deg,#F0C8D0,#D0C8E8);border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:900;color:var(--rose-deep);cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(220,140,170,.3);transition:all .18s;">🏠 Add Project</button>
    </div>

    <!-- Project cards -->
    ${projects.length?`
      <div style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-light);margin-bottom:8px;">🏗️ My Projects <span style="background:var(--blush);color:var(--rose-dark);border-radius:8px;padding:1px 7px;">${projects.length}</span></div>
      ${projects.map(p=>{
        const c=sc(p.status);
        return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;">
            <div style="flex:1;min-width:0;">
              <div style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px;">${p.name}</div>
              <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
                <span style="background:${c.bg};border-radius:20px;padding:2px 10px;font-size:10px;font-weight:800;color:${c.text};">${p.status}</span>
                ${p.start?`<span style="font-size:10px;font-weight:700;color:var(--ink-light);">📅 ${new Date(p.start+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</span>`:""}
                ${p.end?`<span style="font-size:10px;font-weight:700;color:var(--ink-light);">→ ${new Date(p.end+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</span>`:""}
              </div>
            </div>
            <div style="display:flex;gap:5px;flex-shrink:0;">
              <button onclick="editHouseProject('${p.id}')" style="width:30px;height:30px;border-radius:50%;background:var(--blush);border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">✏️</button>
              <button onclick="deleteHouseProject('${p.id}')" style="width:30px;height:30px;border-radius:50%;background:#FFF0F0;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">🗑️</button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <span style="font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);">Progress</span>
            <span style="font-size:11px;font-weight:900;color:${c.text};">${p.progress||0}%</span>
          </div>
          <div style="height:7px;background:#F0E8EC;border-radius:4px;overflow:hidden;margin-bottom:8px;">
            <div style="height:100%;width:${p.progress||0}%;background:${c.bar};border-radius:4px;transition:width .4s;"></div>
          </div>
          <input type="range" min="0" max="100" value="${p.progress||0}" style="width:100%;accent-color:${c.bar};cursor:pointer;margin-bottom:8px;" oninput="updateHouseProgress('${p.id}',this.value)"/>
          <textarea style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:600;color:var(--ink-mid);outline:none;resize:none;min-height:46px;background:#FAFAFA;line-height:1.6;" placeholder="Notes, materials, contractor info..." onchange="updateHouseNote('${p.id}',this.value)">${p.note||""}</textarea>
        </div>`;
      }).join("")}
    `:""}

    <!-- Gantt Timeline -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="padding:12px 14px 10px;border-bottom:1.5px solid #F0E8EC;background:var(--blush);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-deep);flex:1;">📅 Gantt Timeline · ${houseGanttView}mo view</div>
        ${[3,6,12].map(v=>`<button onclick="houseGanttView=${v};renderHouse()" style="border-radius:20px;padding:4px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid;transition:all .15s;${houseGanttView===v?"background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border-color:transparent;box-shadow:0 2px 8px rgba(220,130,160,.3);":"background:white;color:var(--ink-light);border-color:#EEE0EC;"}">${v}mo</button>`).join("")}
      </div>
      <div>${renderGantt()}</div>
    </div>

    <!-- Status legend -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:9px;">✦ Status Key</div>

        ${statuses.map(s=>{const c=sc(s);return`<span style="background:${c.bg};border-radius:20px;padding:3px 11px;font-size:10px;font-weight:800;color:${c.text};">${s}</span>`;}).join("")}

    </div>
  `;
}

function addHouseProject(){
  const name=document.getElementById("hp-name")?.value?.trim();
  if(!name){document.getElementById("hp-name")?.focus();return;}
  const start=document.getElementById("hp-start")?.value||"";
  const end=document.getElementById("hp-end")?.value||"";
  const status=document.getElementById("hp-status")?.value||"Planning";
  const projects=houseProjects();
  projects.push({id:houseUID(),name,start,end,status,progress:0,note:"",created:Date.now()});
  saveHouseProjects(projects);renderHouse();
}
function deleteHouseProject(id){
  if(!confirm("Delete this project?"))return;
  saveHouseProjects(houseProjects().filter(p=>p.id!==id));renderHouse();
}
function updateHouseProgress(id,val){
  const projects=houseProjects();const p=projects.find(p=>p.id===id);
  if(!p)return;p.progress=parseInt(val);
  if(p.progress===100)p.status="Completed";
  else if(p.progress>0&&p.status==="Planning")p.status="In Progress";
  saveHouseProjects(projects);
  // Update UI without full re-render for smooth slider feel
  renderHouse();
}
function updateHouseNote(id,val){
  const projects=houseProjects();const p=projects.find(p=>p.id===id);
  if(!p)return;p.note=val;saveHouseProjects(projects);
}
function editHouseProject(id){
  const projects=houseProjects();const p=projects.find(p=>p.id===id);if(!p)return;
  const name=prompt("Project name:",p.name);if(name===null)return;
  const statuses=["Planning","In Progress","Completed","On Hold","Paused"];
  const si=prompt(`Status (${statuses.join(" / ")}):`,p.status);
  p.name=name.trim()||p.name;
  if(statuses.includes(si))p.status=si;
  saveHouseProjects(projects);renderHouse();
}
function houseNavProject(dir){
  const projects=houseProjects();if(!projects.length)return;
  // scroll to next/prev project card in the list
  const cards=document.querySelectorAll("[id^='hp-card-']");
  // simple: just re-render with a toast
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── GOALS ─────────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const GOAL_CATS=["All","Personal","Career","Health","Financial","Spiritual","Family","Education","Creative","Other"];
const GOAL_STATUSES=["Not Started","In Progress","Completed","On Hold"];
let goalFilter="All", goalCatFilter="All";

function goals(){return lda("goals_v1");}
function saveGoals(a){sva("goals_v1",a);}
function gid(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function aid(){return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

const GOAL_STATUS_STYLE={
  "Not Started":{bar:"#C8B8E0",bg:"rgba(200,184,224,.15)",text:"#6858A8"},
  "In Progress":{bar:"#F0A8C0",bg:"rgba(240,168,192,.15)",text:"#C06880"},
  "Completed":  {bar:"#94C8A8",bg:"rgba(148,200,168,.18)",text:"#3A7858"},
  "On Hold":    {bar:"#F0C090",bg:"rgba(240,192,144,.15)",text:"#A07030"},
};
const GOAL_CAT_EMOJI={Personal:"🌸",Career:"💼",Health:"💪",Financial:"💰",Spiritual:"🙏",Family:"👨‍👩‍👧‍👦",Education:"📚",Creative:"🎨",Other:"✦"};
const gsc=s=>GOAL_STATUS_STYLE[s]||GOAL_STATUS_STYLE["Not Started"];

function renderGoals(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.goals;
  const all=goals();
  const totalG=all.length;
  const inProg=all.filter(g=>g.status==="In Progress").length;
  const done=all.filter(g=>g.status==="Completed").length;
  const avgP=totalG?Math.round(all.reduce((s,g)=>s+(g.progress||0),0)/totalG):0;
  const totalActions=all.reduce((s,g)=>s+(g.actions||[]).length,0);
  const doneActions=all.reduce((s,g)=>s+(g.actions||[]).filter(a=>a.done).length,0);

  // apply filters
  let filtered=all;
  if(goalCatFilter!=="All")filtered=filtered.filter(g=>g.cat===goalCatFilter);
  if(goalFilter==="In Progress")filtered=filtered.filter(g=>g.status==="In Progress");
  else if(goalFilter==="Completed")filtered=filtered.filter(g=>g.status==="Completed");
  else if(goalFilter==="Not Started")filtered=filtered.filter(g=>g.status==="Not Started");

  function goalCard(g){
    const c=gsc(g.status);
    const acts=g.actions||[];
    const actDone=acts.filter(a=>a.done).length;
    const actPct=acts.length?Math.round(actDone/acts.length*100):0;
    const daysLeft=g.target?Math.round((new Date(g.target+"T12:00:00")-new Date())/(864e5)):null;
    const dueLbl=daysLeft===null?""
      :daysLeft<0?`<span style="background:#FFF0F0;color:#C05060;border:1px solid #F0C0C0;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">🚨 ${Math.abs(daysLeft)}d overdue</span>`
      :daysLeft===0?`<span style="background:#FFF8DC;color:#A07020;border:1px solid #F0D878;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">📅 Due today</span>`
      :daysLeft<=7?`<span style="background:#FFF8DC;color:#A07020;border:1px solid #F0D878;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">⏰ ${daysLeft}d left</span>`
      :`<span style="font-size:10px;font-weight:700;color:var(--ink-light);">🎯 ${new Date(g.target+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</span>`;

    const actionRows=acts.map((a,i)=>`
      <div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(220,200,220,.15);">
        <div onclick="toggleGoalAction('${g.id}',${i})" style="width:20px;height:20px;border-radius:50%;border:2px solid ${a.done?"transparent":"#D8C0D8"};background:${a.done?"linear-gradient(135deg,#A8D8B8,#80C8A0)":"white"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;transition:all .18s;">${a.done?"✓":""}</div>
        <span style="flex:1;font-size:12px;font-weight:700;color:${a.done?"var(--ink-light)":"var(--ink)"};${a.done?"text-decoration:line-through;":""}">${a.text}</span>
        <button onclick="deleteGoalAction('${g.id}',${i})" style="background:none;border:none;color:#D8C0C8;cursor:pointer;font-size:12px;padding:0;line-height:1;opacity:0;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">✕</button>
      </div>`).join("");

    return`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 10px rgba(180,120,160,.07);">
      <!-- Goal header -->
      <div style="padding:13px 14px 10px;border-bottom:1.5px dashed #F0E4EC;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;">
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:5px;">${g.title}</div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
              <span style="background:${c.bg};color:${c.text};border-radius:20px;padding:2px 10px;font-size:10px;font-weight:800;">${g.status}</span>
              <span style="background:rgba(200,184,224,.1);color:var(--ink-light);border-radius:20px;padding:2px 10px;font-size:10px;font-weight:800;border:1px solid #EEE0EC;">${GOAL_CAT_EMOJI[g.cat]||"✦"} ${g.cat}</span>
              ${dueLbl}
            </div>
          </div>
          <div style="display:flex;gap:5px;flex-shrink:0;">
            <button onclick="cycleGoalStatus('${g.id}')" style="width:30px;height:30px;border-radius:50%;background:var(--blush);border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;" title="Change status">🔄</button>
            <button onclick="deleteGoal('${g.id}')" style="width:30px;height:30px;border-radius:50%;background:#FFF0F0;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">🗑️</button>
          </div>
        </div>
        <!-- Progress bar -->
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <span style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);">Goal Progress</span>
            <span style="font-size:11px;font-weight:900;color:${c.text};">${g.progress||0}%</span>
          </div>
          <div style="height:8px;background:#F0E8EC;border-radius:4px;overflow:hidden;margin-bottom:6px;">
            <div style="height:100%;width:${g.progress||0}%;background:linear-gradient(90deg,${c.bar},${c.text});border-radius:4px;transition:width .4s;"></div>
          </div>
          <input type="range" min="0" max="100" value="${g.progress||0}" style="width:100%;accent-color:${c.bar};cursor:pointer;" oninput="updateGoalProgress('${g.id}',this.value)"/>
        </div>
        ${g.note?.trim()?`<div style="margin-top:8px;background:rgba(240,200,220,.08);border-left:2.5px solid ${c.bar};border-radius:0 8px 8px 0;padding:6px 10px;font-size:11px;font-weight:600;color:var(--ink-light);line-height:1.5;">📝 ${g.note}</div>`:""}
      </div>
      <!-- Action Items -->
      <div style="padding:10px 14px 4px;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:${c.text};margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;">
          <span>✅ Action Items${acts.length?` (${actDone}/${acts.length})`:""}</span>
          ${acts.length?`<span style="font-size:10px;font-weight:800;color:${c.text};">${actPct}%</span>`:""}
        </div>
        ${acts.length?`<div style="height:4px;background:#F0E8EC;border-radius:2px;overflow:hidden;margin-bottom:8px;"><div style="height:100%;width:${actPct}%;background:${c.bar};border-radius:2px;transition:width .3s;"></div></div>`:""}
        ${actionRows||`<div style="font-size:11px;font-weight:700;color:var(--ink-light);padding:4px 0 6px;">No action items yet — add your first step below 🌸</div>`}
        <!-- Add action row -->
        <div style="display:flex;gap:7px;align-items:center;padding:8px 0 10px;">
          <input id="ai-${g.id}" style="flex:1;border:1.5px solid #EEE0EC;border-radius:24px;padding:7px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;transition:border-color .2s;" placeholder="+ Add an action step..." onkeydown="if(event.key==='Enter'){event.stopPropagation();addGoalAction('${g.id}')}" onfocus="this.style.borderColor='var(--rose)'" onblur="this.style.borderColor='#EEE0EC'"/>
          <button onclick="addGoalAction('${g.id}')" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F0C8D0,#D0C8E8);border:none;color:var(--rose-deep);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(220,140,170,.3);">+</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("pageInner").innerHTML=`
    <!-- Heading -->
    <div style="margin-bottom:14px;">
      <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--rose-deep);">🎯 My Goals</div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-light);margin-top:2px;">Dream it. Plan it. Do it. 🌸</div>
    </div>

    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;">
      ${[
        {v:totalG,  l:"Total",     c:"var(--rose-dark)"},
        {v:inProg,  l:"Active",    c:"var(--lavender)"},
        {v:done,    l:"Done",      c:"var(--mint)"},
        {v:avgP+"%",l:"Avg",       c:"var(--gold)"},
      ].map(s=>`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(180,120,160,.06);">
        <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:${s.c};line-height:1;">${s.v}</div>
        <div style="font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-top:5px;">${s.l}</div>
      </div>`).join("")}
    </div>

    <!-- Action items summary -->
    ${totalActions>0?`<div style="background:white;border:1.5px solid #EEE0EC;border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);">✅ All Action Items</div>
        <div style="font-size:12px;font-weight:900;color:var(--mint);">${doneActions}/${totalActions} done</div>
      </div>
      <div style="height:8px;background:#F0E8EC;border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:${totalActions?Math.round(doneActions/totalActions*100):0}%;background:linear-gradient(90deg,var(--rose),var(--lavender));border-radius:4px;transition:width .5s;"></div>
      </div>
    </div>`:""}

    <!-- Add goal form -->
    <div style="background:white;border:1.5px solid #EEE0EC;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(180,120,160,.06);">
      <div style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-light);margin-bottom:11px;">✦ Add New Goal</div>
      <input id="g-title" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink);outline:none;background:#FAFAFA;margin-bottom:8px;transition:border-color .2s;" placeholder="What do you want to achieve? 🌸" onfocus="this.style.borderColor='var(--rose)'" onblur="this.style.borderColor='#EEE0EC'" onkeydown="if(event.key==='Enter')addGoal()"/>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px;">
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">Category</div>
          <select id="g-cat" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;cursor:pointer;">
            ${GOAL_CATS.slice(1).map(c=>`<option value="${c}">${GOAL_CAT_EMOJI[c]||"✦"} ${c}</option>`).join("")}
          </select>
        </div>
        <div>
          <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">Target Date</div>
          <input id="g-target" type="date" style="width:130px;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);background:#FAFAFA;outline:none;"/>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <div style="font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:4px;">Notes (optional)</div>
        <textarea id="g-note" style="width:100%;border:1.5px solid #EEE0EC;border-radius:10px;padding:8px 11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);outline:none;resize:none;min-height:52px;background:#FAFAFA;line-height:1.6;" placeholder="Your why, motivation, vision..." onkeydown="event.stopPropagation()"></textarea>
      </div>
      <button onclick="addGoal()" style="width:100%;background:linear-gradient(135deg,#F0C8D0,#D0C8E8);border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:900;color:var(--rose-deep);cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(220,140,170,.3);transition:all .18s;">🎯 Add Goal</button>
    </div>

    <!-- Filter chips -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
      ${["All","In Progress","Completed","Not Started"].map(f=>`<button onclick="goalFilter='${f}';renderGoals()" style="border-radius:20px;padding:5px 13px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid;transition:all .15s;${goalFilter===f?"background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border-color:transparent;box-shadow:0 2px 8px rgba(220,130,160,.3);":"background:white;color:var(--ink-light);border-color:#EEE0EC;"}">${f}</button>`).join("")}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;">
      ${GOAL_CATS.map(c=>`<button onclick="goalCatFilter='${c}';renderGoals()" style="flex-shrink:0;border-radius:20px;padding:4px 11px;font-size:10px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;border:1.5px solid;transition:all .15s;${goalCatFilter===c?"background:linear-gradient(135deg,#D8C8E8,#C8B8D8);color:var(--rose-deep);border-color:transparent;":"background:white;color:var(--ink-light);border-color:#EEE0EC;"}">${c==="All"?"All":GOAL_CAT_EMOJI[c]+" "+c}</button>`).join("")}
    </div>

    <!-- Goals list -->
    ${filtered.length===0
      ? `<div style="text-align:center;padding:36px 20px;"><span style="font-size:44px;display:block;margin-bottom:12px;">🎯</span><div style="font-family:'Dancing Script',cursive;font-size:20px;color:var(--rose-d);">${all.length?"No goals match this filter":"No goals yet"}</div><div style="font-size:12px;font-weight:700;color:var(--ink-light);margin-top:6px;">${all.length?"Try a different filter":"Add your first goal above 🌸"}</div></div>`
      : filtered.map(g=>goalCard(g)).join("")
    }
  `;
}

function addGoal(){
  const title=document.getElementById("g-title")?.value?.trim();
  if(!title){document.getElementById("g-title")?.focus();return;}
  const cat=document.getElementById("g-cat")?.value||"Personal";
  const target=document.getElementById("g-target")?.value||"";
  const note=document.getElementById("g-note")?.value?.trim()||"";
  const all=goals();
  all.unshift({id:gid(),title,cat,target,note,status:"Not Started",progress:0,actions:[],created:Date.now()});
  saveGoals(all);renderGoals();
}
function deleteGoal(id){
  if(!confirm("Delete this goal?"))return;
  saveGoals(goals().filter(g=>g.id!==id));renderGoals();
}
function updateGoalProgress(id,val){
  const all=goals();const g=all.find(g=>g.id===id);if(!g)return;
  g.progress=parseInt(val);
  if(g.progress===100&&g.status!=="Completed")g.status="Completed";
  else if(g.progress>0&&g.status==="Not Started")g.status="In Progress";
  saveGoals(all);renderGoals();
}
function cycleGoalStatus(id){
  const all=goals();const g=all.find(g=>g.id===id);if(!g)return;
  const idx=GOAL_STATUSES.indexOf(g.status);
  g.status=GOAL_STATUSES[(idx+1)%GOAL_STATUSES.length];
  if(g.status==="Completed")g.progress=100;
  saveGoals(all);renderGoals();
}
function addGoalAction(gid){
  const inp=document.getElementById("ai-"+gid);
  const text=inp?.value?.trim();if(!text)return;
  const all=goals();const g=all.find(g=>g.id===gid);if(!g)return;
  if(!g.actions)g.actions=[];
  g.actions.push({id:aid(),text,done:false});
  saveGoals(all);
  inp.value="";
  renderGoals();
  setTimeout(()=>document.getElementById("ai-"+gid)?.focus(),60);
}
function toggleGoalAction(gid,idx){
  const all=goals();const g=all.find(g=>g.id===gid);if(!g||!g.actions)return;
  g.actions[idx].done=!g.actions[idx].done;
  // Auto-update goal progress from action completion
  const pct=Math.round(g.actions.filter(a=>a.done).length/g.actions.length*100);
  g.progress=pct;
  if(pct===100)g.status="Completed";
  else if(pct>0&&g.status==="Not Started")g.status="In Progress";
  saveGoals(all);renderGoals();
}
function deleteGoalAction(gid,idx){
  const all=goals();const g=all.find(g=>g.id===gid);if(!g||!g.actions)return;
  g.actions.splice(idx,1);
  saveGoals(all);renderGoals();
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── EXERCISE TRACKER ──────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const EX_TYPES=["Running","Walking","Cycling","Swimming","HIIT","Strength","Yoga","Pilates","Stretching","Other"];
const EX_EMOJI={Running:"🏃",Walking:"🚶",Cycling:"🚴",Swimming:"🏊",HIIT:"⚡",Strength:"🏋️",Yoga:"🧘",Pilates:"🌀",Stretching:"🤸",Other:"💪"};
const EX_COL={Running:"#F0A8B8",Walking:"#A8C8E8",Cycling:"#F0C890",Swimming:"#90C8E8",HIIT:"#F08888",Strength:"#B8A8E0",Yoga:"#A8D8B8",Pilates:"#F0C8A8",Stretching:"#C8E8A8",Other:"#E8A8C8"};

function exLogs(){return lda("ex_logs");}
function saveEx(a){sva("ex_logs",a);}
function exUID(){return "ex"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

let exViewDate=tds().slice(0,7); // YYYY-MM

function renderExercise(){
  document.getElementById("accentStrip").style.background=ACCENT_STRIPS.exercise;
  const logs=exLogs();
  const today=tds();
  const thisMonth=today.slice(0,7);
  const monthLogs=logs.filter(l=>l.date&&l.date.startsWith(exViewDate));
  const totalMins=monthLogs.reduce((s,l)=>s+(parseInt(l.duration)||0),0);
  const totalCal=monthLogs.reduce((s,l)=>s+(parseInt(l.calories)||0),0);
  const sessions=monthLogs.length;
  // streak: consecutive days with at least one log
  const dateSet=new Set(logs.map(l=>l.date));
  let streak=0,d=new Date(today);
  while(dateSet.has(d.toISOString().split("T")[0])){streak++;d.setDate(d.getDate()-1);}

  const viewMonthLabel=new Date(exViewDate+"-01").toLocaleDateString("en",{month:"long",year:"numeric"});

  const grouped={};
  monthLogs.sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>{
    (grouped[l.date]=grouped[l.date]||[]).push(l);
  });

  function logCard(l){
    const col=EX_COL[l.type]||EX_COL.Other;
    const em=EX_EMOJI[l.type]||"💪";
    return`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(220,200,220,.15);">
      <div style="width:38px;height:38px;border-radius:12px;background:${col}33;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${em}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px;">${l.type}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${l.duration?`<span style="background:${col}22;color:var(--ink-mid);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">⏱ ${l.duration} min</span>`:""}
          ${l.calories?`<span style="background:#FFF0F4;color:var(--rose-dark);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">🔥 ${l.calories} kcal</span>`:""}
          ${l.distance?`<span style="background:#F0FFF8;color:var(--mint);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">📍 ${l.distance}</span>`:""}
          ${l.sets?`<span style="background:#F8F0FF;color:var(--lavender);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;">${l.sets} sets × ${l.reps||"?"}</span>`:""}
        </div>
        ${l.notes?`<div style="margin-top:5px;font-size:11px;font-weight:600;color:var(--ink-light);">📝 ${l.notes}</div>`:""}

function logExercise(){
  const type=document.getElementById("ex-type")?.value||"Other";
  const date=document.getElementById("ex-date")?.value||tds();
  const duration=document.getElementById("ex-dur")?.value||"";
  const calories=document.getElementById("ex-cal")?.value||"";
  const distance=document.getElementById("ex-dist")?.value||"";
  const sets=document.getElementById("ex-sets")?.value||"";
  const reps=document.getElementById("ex-reps")?.value||"";
  const notes=document.getElementById("ex-notes")?.value?.trim()||"";
  const logs=exLogs();
  logs.unshift({id:exUID(),type,date,duration,calories,distance,sets,reps,notes,created:Date.now()});
  saveEx(logs);renderExercise();
}
function deleteEx(id){saveEx(exLogs().filter(l=>l.id!==id));renderExercise();}
function exNavMonth(dir){
  const d=new Date(exViewDate+"-01");d.setMonth(d.getMonth()+dir);
  exViewDate=d.toISOString().slice(0,7);renderExercise();
}

const BUD_EXP_CATS=["Food","Transport","Bills","Shopping","Health","Entertainment","Beauty","Home","Education","Savings","Other"];

            <div style="padding:2px 14px 4px;">${entries.map(e=>entryRow(e)).join("")}</div>

let budEntryType="expense";
function setBudType(type){
  budEntryType=type;
  const ec=BUD_EXP_CATS,ic=BUD_INC_CATS;

// ── CALENDAR EVENTS ───────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function calEvents(){return lda("cal_events_v1");}
function saveCalEvents(a){sva("cal_events_v1",a);}
function ceUID(){return "ce"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
let selEvColorVal="#F0A8B8";

function selEvColor(col,mi,el){
  selEvColorVal=col;
  document.querySelectorAll(`#ev-colors-${mi} div`).forEach(d=>{d.style.border="2.5px solid transparent";});
  el.style.border="2.5px solid var(--ink)";
}
function addCalEvent(mi){
  const titleEl=document.getElementById(`ev-title-${mi}`);
  const title=titleEl?.value?.trim();
  if(!title){titleEl?.focus();return;}
  const date=document.getElementById(`ev-date-${mi}`)?.value||`2026-${String(mi+1).padStart(2,"0")}-01`;
  const time=document.getElementById(`ev-time-${mi}`)?.value||"";
  const recur=window[`selRecur_${mi}`]||"none";
  const all=calEvents();

  if(recur==="none"){
    all.push({id:ceUID(),title,date,time,color:selEvColorVal,recur:"none",created:Date.now()});
  } else {
    // Generate recurring events across 2026
    const instances=generateRecurring(title,date,time,selEvColorVal,recur);
    instances.forEach(ev=>all.push(ev));
  }
  saveCalEvents(all);
  if(titleEl)titleEl.value="";
  window[`selRecur_${mi}`]="none";
  renderMonth(mi);
}
function generateRecurring(title,startDate,time,color,recur){
  const events=[];
  const baseId="rc"+Date.now().toString(36);
  const start=new Date(startDate+"T12:00:00");
  const yearEnd=new Date("2026-12-31T12:00:00");
  let cur=new Date(start);
  let count=0;
  while(cur<=yearEnd&&count<500){
    const dateStr=cur.toISOString().split("T")[0];
    events.push({id:ceUID(),title,date:dateStr,time,color,recur,recurBaseId:baseId,created:Date.now()});
    if(recur==="daily")cur.setDate(cur.getDate()+1);
    else if(recur==="weekly")cur.setDate(cur.getDate()+7);
    else if(recur==="monthly")cur.setMonth(cur.getMonth()+1);
    else if(recur==="yearly")cur.setFullYear(cur.getFullYear()+1);
    else break;
    count++;
  }
  return events;
}
function saveCalEvent(id,mi){
  const all=calEvents();
  const e=all.find(e=>e.id===id);if(!e)return;
  e.title=document.getElementById("ev-edit-title")?.value?.trim()||e.title;
  e.date=document.getElementById("ev-edit-date")?.value||e.date;
  e.time=document.getElementById("ev-edit-time")?.value||"";
  e.color=window.editEvColor||e.color;
  const newRecur=window.editEvRecur||e.recur||"none";
  // If recur changed, ask if user wants to update all instances
  if(newRecur!==e.recur&&e.recurBaseId){
    if(confirm("Update all recurring instances of this event?")){
      all.filter(ev=>ev.recurBaseId===e.recurBaseId).forEach(ev=>{ev.title=e.title;ev.time=e.time;ev.color=e.color;});
    }
  }
  e.recur=newRecur;
  saveCalEvents(all);
  window.editingEvId=null;
  renderMonth(mi);
}
function deleteCalEvent(id){
  const all=calEvents();
  const e=all.find(ev=>ev.id===id);
  if(e?.recurBaseId&&all.filter(ev=>ev.recurBaseId===e.recurBaseId).length>1){
    const choice=confirm("Delete all recurring instances? OK = all, Cancel = this one only");
    if(choice){saveCalEvents(all.filter(ev=>ev.recurBaseId!==e.recurBaseId));}
    else{saveCalEvents(all.filter(ev=>ev.id!==id));}
  } else {
    saveCalEvents(all.filter(ev=>ev.id!==id));
  }
}

let weekPlanOffset=0;

function getWeekPlanDays(offset){
  const now=new Date();
  const dow=now.getDay();
  const sun=new Date(now); sun.setDate(now.getDate()-dow+offset*7);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(sun); d.setDate(sun.getDate()+i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const ns=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    return{date:ds,dayName:["SUN","MON","TUE","WED","THU","FRI","SAT"][i],dayNum:d.getDate(),
      monthShort:d.toLocaleDateString("en",{month:"short"}),isToday:ds===ns,isPast:ds<ns,dow:i};
  });
}

function saveTBWeek(date,h,val){
  let d={};try{d=JSON.parse(ld("wtb_"+date,"{}"));}catch(e){}
  d[String(h)]=val; sv("wtb_"+date,JSON.stringify(d));
}
function getTBWeek(date){try{return JSON.parse(ld("wtb_"+date,"{}"));}catch(e){return{};}}

function toggleWPTask(date,n,el){

  el.style.borderColor=now?"#88C8A8":"#D8C0C8";
  el.textContent=now?"✓":"";
